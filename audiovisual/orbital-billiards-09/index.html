<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ORBITAL BILLIARDS 09</title><style>*{box-sizing:border-box}html,body{margin:0;background:#030711;color:#dff;font:12px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}header{position:fixed;top:env(safe-area-inset-top);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:15px;letter-spacing:2px}#status{font:10px/1.5 monospace;text-align:right}aside{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;max-width:740px;margin:auto;padding:10px;border-radius:13px;background:#071525ed;border:1px solid #36738b}.buttons,.grid{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}button{min-height:40px;background:#164558;border:1px solid #438d9e;color:#eff;border-radius:8px;font-size:10px}label{font-size:10px;color:#acd}b{float:right;color:#fff}input{width:100%;accent-color:#72e8dc}p{text-align:center;font-size:10px;color:#9bc}#err{color:#fba;font:10px monospace;min-height:12px}</style></head><body><canvas id="cv"></canvas><header><h1>ORBITAL BILLIARDS 09</h1><div id="status">FPS --<br>AUDIO OFF<br>HITS 0</div></header><aside><div class="buttons"><button id="start">START AUDIO</button><button id="test">TEST NOTE</button><button id="shape">7 SIDES</button><button id="reset">RESEED</button></div><div class="grid"><label>SPEED <b id="vs">1</b><input id="s" type="range" min=".2" max="3" step=".1" value="1"></label><label>PARTICLES <b id="vn">16</b><input id="n" type="range" min="3" max="48" value="16"></label><label>REFLECTION <b id="vr">1</b><input id="r" type="range" min=".3" max="1.6" step=".01" value="1"></label><label>ROOT <b id="vp">110</b><input id="p" type="range" min="55" max="330" value="110"></label><label>DECAY <b id="vd">.6</b><input id="d" type="range" min=".1" max="2" step=".01" value=".6"></label><label>TRAILS <b id="vt">.25</b><input id="t" type="range" min=".05" max=".8" step=".01" value=".25"></label></div><p>Touch to launch a particle · drag to aim · headphones for stereo collisions</p><div id="err"></div></aside><script>
(()=>{'use strict';const $=x=>document.getElementById(x),c=$('cv'),g=c.getContext('2d');let W,H,D,clock=0,last=0,frames=0,sec=0,hits=0,sides=7,poly=[],balls=[],bursts=[],ctx=null,out=null,on=false,down=null;let v={};for(let k of ['s','n','r','p','d','t']){v[k]=+$(k).value;$(k).oninput=()=>{v[k]=+$(k).value;$('v'+k).textContent=v[k];if(k==='n')seed()}}function err(e){$('err').textContent='ERROR '+String(e.message||e);console.error(e)}addEventListener('error',e=>err(e.error||e.message));addEventListener('unhandledrejection',e=>err(e.reason));function geometry(){poly=[];let R=Math.min(W*.44,H*.32);for(let i=0;i<sides;i++){let a=i*Math.PI*2/sides-Math.PI/2;poly.push({x:W/2+Math.cos(a)*R,y:H*.42+Math.sin(a)*R})}}function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);geometry()}addEventListener('resize',resize);function seed(){balls=[];for(let i=0;i<v.n;i++){let a=i*2.39996;balls.push({x:W/2+Math.cos(a)*20,y:H*.42+Math.sin(a)*20,vx:Math.cos(i*1.67)*105,vy:Math.sin(i*1.67)*105,h:i*360/v.n})}}function tone(f,pan=0,vol=.13){if(!on||!ctx||ctx.state!=='running')return;let t=ctx.currentTime,o=ctx.createOscillator(),a=ctx.createGain(),p=ctx.createStereoPanner?ctx.createStereoPanner():null;o.type='sine';o.frequency.setValueAtTime(Math.min(2400,f),t);o.frequency.exponentialRampToValueAtTime(Math.max(50,f*.8),t+.1);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(vol,t+.012);a.gain.exponentialRampToValueAtTime(.0001,t+v.d);o.connect(a);if(p){p.pan.value=Math.max(-1,Math.min(1,pan));a.connect(p);p.connect(out)}else a.connect(out);o.start(t);o.stop(t+v.d+.05)}async function start(){try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();out=ctx.createGain();out.gain.value=.5;let comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=10;out.connect(comp);comp.connect(ctx.destination)}await ctx.resume();on=true;$('start').textContent='AUDIO ON';tone(440,0,.25);$('err').textContent='AUDIO '+ctx.state}catch(e){err(e)}}$('start').onclick=()=>{if(on){on=false;$('start').textContent='START AUDIO'}else start()};$('test').onclick=()=>{if(!on)start();else tone(440,0,.25)};$('shape').onclick=()=>{sides=sides===7?3:sides===3?4:sides===4?5:sides===5?9:7;geometry();seed();$('shape').textContent=sides+' SIDES'};$('reset').onclick=()=>{seed();bursts=[]};c.onpointerdown=e=>{down={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);bursts.push({x:e.clientX,y:e.clientY,t:0})};c.onpointerup=e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y,m=Math.hypot(dx,dy);balls.push({x:down.x,y:down.y,vx:m>8?dx*2:105,vy:m>8?dy*2:83,h:clock*60%360});if(balls.length>80)balls.shift();tone(v.p*2,0,.2);down=null};c.onpointercancel=()=>down=null;function step(dt){let edges=poly.map((p,i)=>{let q=poly[(i+1)%poly.length],dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy);return {p,nx:-dy/len,ny:dx/len,i}});for(let b of balls){b.x+=b.vx*dt*v.s;b.y+=b.vy*dt*v.s;for(let e of edges){let dist=(b.x-e.p.x)*e.nx+(b.y-e.p.y)*e.ny;if(dist<2){b.x+=(2-dist)*e.nx;b.y+=(2-dist)*e.ny;let dot=b.vx*e.nx+b.vy*e.ny;if(dot<0){b.vx-=2*dot*e.nx;b.vy-=2*dot*e.ny;let a=Math.atan2(b.vy,b.vx),normal=Math.atan2(e.ny,e.nx),angle=Math.atan2(Math.sin(a-normal),Math.cos(a-normal));a=normal+angle*v.r;let speed=Math.hypot(b.vx,b.vy);b.vx=Math.cos(a)*speed;b.vy=Math.sin(a)*speed;hits++;bursts.push({x:b.x,y:b.y,t:0});if(bursts.length>80)bursts.shift();tone(v.p*[1,1.125,1.25,1.333,1.5,1.667,2,2.5,3][e.i%9],b.x/W*2-1,.08)}}}}for(let z of bursts)z.t+=dt;bursts=bursts.filter(z=>z.t<1)}function draw(){g.fillStyle='rgba(3,7,17,'+v.t+')';g.fillRect(0,0,W,H);g.save();g.globalCompositeOperation='lighter';g.beginPath();poly.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.strokeStyle='#5bc7d5';g.stroke();for(let b of balls){g.beginPath();g.arc(b.x,b.y,2.6,0,Math.PI*2);g.fillStyle='hsl('+b.h+',100%,75%)';g.shadowColor=g.fillStyle;g.shadowBlur=9;g.fill()}g.shadowBlur=0;for(let z of bursts){g.beginPath();g.arc(z.x,z.y,3+z.t*28,0,Math.PI*2);g.strokeStyle='rgba(130,238,240,'+(1-z.t)+')';g.stroke()}g.restore()}function frame(ms){requestAnimationFrame(frame);let dt=Math.min(.035,(ms-last)/1000||.016);last=ms;clock+=dt;sec+=dt;frames++;if(sec>.8){$('status').innerHTML='FPS '+Math.round(frames/sec)+'<br>AUDIO '+(ctx?ctx.state.toUpperCase():'OFF')+'<br>HITS '+hits;sec=0;frames=0}try{let n=Math.max(1,Math.ceil(dt/.012));for(let i=0;i<n;i++)step(dt/n);draw()}catch(e){err(e)}}resize();seed();requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(ctx&&document.hidden)ctx.suspend().catch(err);else if(ctx&&on)ctx.resume().catch(err)})})();
</script></body></html>
