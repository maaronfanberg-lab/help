<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>String Garden 05</title><style>html,body{margin:0;background:#030915;color:#dff;font:12px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:10px;left:12px;font-size:17px;letter-spacing:2px}#status{position:fixed;top:12px;right:12px;font:10px monospace}section{position:fixed;bottom:12px;left:9px;right:9px;padding:10px;border:1px solid #468b9c;border-radius:14px;background:#071929e9}.row,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{padding:12px 3px;background:#14536a;color:white;border:1px solid #6ab5c5;border-radius:8px}label{font-size:10px;color:#9cd}input{width:100%;accent-color:#5dd}#message{font-size:10px;color:#bde;margin-top:8px}</style><canvas id="c"></canvas><header>STRING GARDEN / 05</header><div id="status">STARTING</div><section><div class="row"><button id="sound">▶ SOUND</button><button id="test">♪ TEST NOTE</button><button id="auto">AUTO OFF</button></div><div class="grid"><label>TENSION<input id="t" type="range" min=".3" max="1.7" step=".01" value="1"></label><label>DAMPING<input id="d" type="range" min=".002" max=".08" step=".001" value=".014"></label><label>COUPLING<input id="k" type="range" min="0" max=".3" step=".01" value=".1"></label><label>PITCH<input id="p" type="range" min="70" max="300" value="110"></label><label>BRIGHTNESS<input id="b" type="range" min=".1" max="1" step=".01" value=".6"></label><label>DECAY<input id="r" type="range" min=".3" max="4" step=".1" value="2"></label></div><div id="message">Touch a string to pluck · drag to strum</div></section><script>(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d'),N=12,M=60,TAU=2*Math.PI,$=id=>document.getElementById(id),a=Array.from({length:N},()=>new Float32Array(M)),b=Array.from({length:N},()=>new Float32Array(M)),z=Array.from({length:N},()=>new Float32Array(M));let W,H,ctx,master,voices=[],on=false,auto=false,last=0,fps=60,err=0,lastI=-1,clock=0;function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,1.5);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}onresize=resize;resize();function val(id){return +$(id).value}function note(i,power=1){let mid=20;for(let j=1;j<M-1;j++)a[i][j]+=(j<mid?j/mid:(M-1-j)/(M-1-mid))*.85*power;if(on){let v=voices[i],now=ctx.currentTime,rat=[1,9/8,5/4,4/3,3/2,5/3,15/8,2,9/4,5/2,3,4];v.o.frequency.setTargetAtTime(val('p')*rat[i]*Math.sqrt(val('t')),now,.015);v.g.gain.cancelScheduledValues(now);v.g.gain.setValueAtTime(.0001,now);v.g.gain.linearRampToValueAtTime(.025*val('b')*power,now+.015);v.g.gain.exponentialRampToValueAtTime(.0001,now+val('r'))}$('message').textContent='PLUCK '+(i+1)+' · '+(on?'AUDIO ON':'SOUND OFF')}async function start(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.5;let comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);for(let i=0;i<N;i++){let o=ctx.createOscillator(),gain=ctx.createGain(),pan=ctx.createStereoPanner?ctx.createStereoPanner():null;o.type=i%3?'sine':'triangle';gain.gain.value=.0001;o.connect(gain);if(pan){gain.connect(pan);pan.pan.value=-.8+i*1.6/(N-1);pan.connect(master)}else gain.connect(master);o.start();voices.push({o,g:gain})}}await ctx.resume();on=true;$('sound').textContent='■ MUTE';note(4)}$('sound').onclick=async()=>{try{if(on){on=false;master.gain.value=0;$('sound').textContent='▶ SOUND'}else{if(master)master.gain.value=.5;await start()}}catch(e){$('message').textContent=e.message;err++}};$('test').onclick=async()=>{try{if(!on)await start();note(7,1.4)}catch(e){$('message').textContent=e.message;err++}};$('auto').onclick=()=>{auto=!auto;$('auto').textContent='AUTO '+(auto?'ON':'OFF')};function pick(e){let top=H*.17,bot=Math.min(H-170,H*.74);return Math.max(0,Math.min(N-1,Math.floor((e.clientY-top)/(bot-top)*N)))}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);lastI=pick(e);note(lastI)};c.onpointermove=e=>{if(e.buttons||e.pressure){let i=pick(e);if(i!==lastI){lastI=i;note(i)}}};c.onpointerup=()=>lastI=-1;function frame(ms){requestAnimationFrame(frame);try{let dt=Math.min(.05,(ms-last)/1000||.016);last=ms;fps+=(1/dt-fps)*.08;clock+=dt;if(auto&&clock>.4){clock=0;note(Math.floor(Math.random()*N),.6)}for(let i=0;i<N;i++){for(let j=1;j<M-1;j++){let lap=a[i][j-1]+a[i][j+1]-2*a[i][j];z[i][j]=Math.max(-2,Math.min(2,(2*a[i][j]-b[i][j])*(1-val('d'))+.22*val('t')*lap+val('k')*.03*(a[(i+1)%N][j]+a[(i+N-1)%N][j]-2*a[i][j])))}}for(let i=0;i<N;i++){b[i].set(a[i]);a[i].set(z[i])}g.fillStyle='rgba(3,9,21,.3)';g.fillRect(0,0,W,H);let top=H*.17,bot=Math.min(H-170,H*.74),L=W*.08,R=W*.92;g.globalCompositeOperation='lighter';for(let i=0;i<N;i++){let y=top+(bot-top)*(i+.5)/N;g.beginPath();for(let j=0;j<M;j++){let x=L+(R-L)*j/(M-1),yy=y+a[i][j]*Math.min(45,(bot-top)/N*1.5);if(!j)g.moveTo(x,yy);else g.lineTo(x,yy)}g.strokeStyle='hsla('+(160+i*14)+',95%,70%,.8)';g.lineWidth=1.6;g.stroke()}g.globalCompositeOperation='source-over';$('status').textContent='FPS '+Math.round(fps)+' | AUDIO '+(ctx?ctx.state:'off')+' | ERR '+err}catch(e){err++;$('message').textContent='ERROR '+e.message}}requestAnimationFrame(frame);window.addEventListener('error',e=>{err++;$('message').textContent='ERROR '+e.message})})();</script></html>
