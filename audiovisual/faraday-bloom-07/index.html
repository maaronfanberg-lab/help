<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FARADAY BLOOM 07</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030817;color:#dffaff;font:12px system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:calc(10px + env(safe-area-inset-top));left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 8px #000}h1{font-size:16px;font-weight:550;letter-spacing:.16em;margin:0 0 4px}small{font-size:10px;color:#92bdcc;letter-spacing:.07em}#status{font:10px/1.55 ui-monospace,monospace;text-align:right;color:#a4ecea}#panel{position:fixed;bottom:calc(9px + env(safe-area-inset-bottom));left:9px;right:9px;max-width:780px;margin:auto;padding:10px;border:1px solid #38788c;background:#051625eb;border-radius:15px;backdrop-filter:blur(10px)}.actions{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:6px;margin-bottom:9px}button{min-height:40px;border:1px solid #418b9b;background:#154053;color:#e5ffff;border-radius:9px;font:600 10px system-ui;touch-action:manipulation}#sound{background:#136873}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px}label{display:block;font-size:10px;color:#a6c8d3}label span{float:right;color:#e5ffff}input{display:block;width:100%;height:22px;accent-color:#68e4e5;touch-action:pan-x}#msg{font-size:10px;color:#a4d2d8;min-height:15px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#prompt{position:fixed;top:25%;width:100%;text-align:center;color:#a4dce2;pointer-events:none;font-size:12px;letter-spacing:.08em}a{color:#9ddde9}@media(max-width:430px){h1{font-size:14px}#panel{padding:8px}.grid{gap:5px 7px}label{font-size:9px}button{font-size:9px}#status{font-size:9px}}</style></head><body>
<canvas id="field"></canvas><header><div><h1>FARADAY BLOOM <span style="color:#78e4e8">07</span></h1><small>PARAMETRIC SURFACE RESONANCE</small></div><div id="status">VISUAL STARTING<br>AUDIO OFF<br>ERROR NONE</div></header><div id="prompt">TOUCH THE SURFACE TO EXCITE ITS MODES</div>
<section id="panel"><div class="actions"><button id="sound">START SOUND</button><button id="test">TEST NOTE</button><button id="mode">VIEW: SURFACE</button><button id="auto">AUTO: OFF</button></div><div class="grid">
<label>DRIVE <span id="vd">0.42</span><input id="d" type="range" min="0" max="1" step=".01" value=".42"></label><label>DRIVE RATE <span id="vf">1.00</span><input id="f" type="range" min=".3" max="2.5" step=".01" value="1"></label><label>DAMPING <span id="vl">0.16</span><input id="l" type="range" min=".02" max=".8" step=".01" value=".16"></label>
<label>MODE COMPLEXITY <span id="vc">4</span><input id="c" type="range" min="2" max="8" step="1" value="4"></label><label>PITCH <span id="vp">110</span><input id="p" type="range" min="55" max="330" step="1" value="110"></label><label>AUDIO → WAVE <span id="vb">0.35</span><input id="b" type="range" min="0" max="1" step=".01" value=".35"></label>
</div><div id="msg">Ready · tap TEST NOTE for an audible diagnostic</div></section>
<script>
(()=>{'use strict';const cv=document.getElementById('field'),g=cv.getContext('2d',{alpha:false});const $=id=>document.getElementById(id),N=28,TAU=Math.PI*2,par={};let W=0,H=0,D=1,last=0,elapsed=0,fps=0,frames=0,frameTime=0,auto=false,view=0,drag=false,audio=null,master=null,analyser=null,voices=[],playing=false,audioLevel=0,error='NONE',impulseCount=0,stepCount=0;const modes=[];
for(let n=1;n<=7;n++)for(let m=1;m<=4;m++)modes.push({n,m,x:0,v:0,phase:Math.random()*TAU});
function msg(s){$('msg').textContent=s}function fail(e){error=String(e&&e.message||e).slice(0,45);msg('ERROR: '+error);updateStatus()}window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
for(let id of ['d','f','l','c','p','b']){const el=$(id);par[id]=+el.value;el.addEventListener('input',()=>{par[id]=+el.value;$('v'+id).textContent=id==='p'||id==='c'?String(par[id]):par[id].toFixed(2);msg(id.toUpperCase()+' = '+$('v'+id).textContent)})}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);cv.width=Math.round(W*D);cv.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);g.fillStyle='#030817';g.fillRect(0,0,W,H)}addEventListener('resize',resize);resize();
function excite(nx,ny,amount=1){let x=Math.max(0,Math.min(1,nx)),y=Math.max(0,Math.min(1,ny));for(let o of modes){let basis=Math.sin(Math.PI*o.n*x)*Math.sin(Math.PI*o.m*y);o.v+=amount*basis/(1+.09*(o.n*o.n+o.m*o.m))}impulseCount++;msg('SURFACE EXCITED · '+impulseCount+' gestures');$('prompt').style.opacity='0'}
function touch(e,force){let rect=cv.getBoundingClientRect(),cx=W*.5,cy=H*.43,R=Math.min(W*.45,H*.35);let x=(e.clientX-(cx-R))/(2*R),y=(e.clientY-(cy-R))/(2*R);excite(x,y,force);if(playing)ping(1.1,.14)}
cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);touch(e,2.3)});cv.addEventListener('pointermove',e=>{if(drag&&stepCount++%2===0)touch(e,.45)});cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);
$('mode').onclick=()=>{view=(view+1)%3;$('mode').textContent='VIEW: '+['SURFACE','ISOLINES','MESH'][view];msg('VIEW CHANGED')};
$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'AUTO: ON':'AUTO: OFF';msg(auto?'AUTO EXCITATION ACTIVE':'AUTO EXCITATION STOPPED')};
async function ensureAudio(){if(!audio){let AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio unavailable');audio=new AC();master=audio.createGain();master.gain.value=.35;let comp=audio.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=6;master.connect(comp);analyser=audio.createAnalyser();analyser.fftSize=128;comp.connect(analyser);analyser.connect(audio.destination);for(let i=0;i<8;i++){let o=audio.createOscillator(),gain=audio.createGain(),pan=audio.createStereoPanner?audio.createStereoPanner():null;o.type=i%3===0?'triangle':'sine';gain.gain.value=0;o.connect(gain);if(pan){gain.connect(pan);pan.connect(master)}else gain.connect(master);o.start();voices.push({o,gain,pan})}}await audio.resume();if(audio.state!=='running')throw Error('Audio context '+audio.state)}
function ping(mult=1,duration=.25){if(!audio)return;const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(par.p*mult*2,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.23,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+duration+.02);osc.onended=()=>{osc.disconnect();gain.disconnect()}}
$('sound').onclick=async()=>{try{await ensureAudio();playing=!playing;$('sound').textContent=playing?'MUTE SOUND':'START SOUND';if(playing){ping(1,.3);excite(.5,.5,2.4)}else voices.forEach(v=>v.gain.gain.setTargetAtTime(0,audio.currentTime,.04));msg(playing?'AUDIO RUNNING · touch to play':'AUDIO MUTED');updateStatus()}catch(e){fail(e)}};
$('test').onclick=async()=>{try{await ensureAudio();ping(1,.45);ping(1.5,.35);excite(.5,.5,3.5);msg('TEST NOTE TRIGGERED · audio '+audio.state);updateStatus()}catch(e){fail(e)}};
function updateStatus(){const state=audio?(audio.state+(playing?' · LIVE':' · TEST')):'OFF';$('status').textContent='FPS '+Math.round(fps)+' · TOUCH '+impulseCount+'\nAUDIO '+state+'\nERROR '+error}
function tick(ts){requestAnimationFrame(tick);try{let dt=Math.min(.034,Math.max(0,(ts-last)/1000||.016));last=ts;elapsed+=dt;frameTime+=dt;frames++;if(frameTime>.75){fps=frames/frameTime;frames=0;frameTime=0;updateStatus()}if(auto&&Math.floor(elapsed*1.4)!==Math.floor((elapsed-dt)*1.4))excite(Math.random(),Math.random(),2);
if(analyser&&audio.state==='running'){let arr=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(arr);let s=0;for(let v of arr)s+=v;audioLevel+=(s/arr.length/255-audioLevel)*.08}
let rate=par.f,drive=par.d*(1+par.b*audioLevel*.6),loss=par.l,limit=par.c;
for(let o of modes){let freq=Math.sqrt(o.n*o.n+o.m*o.m)/Math.SQRT2;let natural=freq*.82;let forcing=1+drive*.9*Math.cos(elapsed*rate*5.4);let accel=-natural*natural*forcing*o.x-loss*2*o.v-.22*o.x*o.x*o.x;o.v+=accel*dt*4;o.x+=o.v*dt*4;o.x=Math.max(-3,Math.min(3,o.x));o.v=Math.max(-6,Math.min(6,o.v))}
const cx=W*.5,cy=H*.43,R=Math.min(W*.45,H*.35);g.fillStyle='rgba(3,8,23,.27)';g.fillRect(0,0,W,H);let count=W<500?30:44,cell=2*R/count,amp=0;
function height(u,v){let z=0;for(let o of modes){if(o.n>limit||o.m>limit)continue;z+=o.x*Math.sin(Math.PI*o.n*u)*Math.sin(Math.PI*o.m*v)/(1+.06*(o.n*o.n+o.m*o.m))}return z}
g.save();g.globalCompositeOperation='lighter';for(let iy=0;iy<count;iy++)for(let ix=0;ix<count;ix++){let u=(ix+.5)/count,v=(iy+.5)/count,z=height(u,v),x=cx-R+(ix+.5)*cell,y=cy-R+(iy+.5)*cell,bright=Math.min(1,Math.abs(z)*.9),hue=(175+z*100+elapsed*5+360)%360;let alpha=view===1?(.06+bright*.35):(.08+bright*.45);if(view===1&&Math.abs(z)%0.23>.07)continue;g.fillStyle='hsla('+hue+',95%,'+(45+bright*40)+'%,'+alpha+')';g.fillRect(x,y,cell+.5,cell+.5);amp+=Math.abs(z);if(view===2&&ix%3===0&&iy%3===0){g.strokeStyle='rgba(170,245,250,.2)';g.strokeRect(x,y,cell*3,cell*3)}}
g.restore();const strength=Math.min(1,amp/(count*count)*3);g.beginPath();g.arc(cx,cy,R*1.02,0,TAU);g.strokeStyle='rgba(108,221,238,.25)';g.lineWidth=1;g.stroke();
if(audio&&playing&&audio.state==='running'){let now=audio.currentTime,ratios=[1,9/8,5/4,4/3,3/2,5/3,2,5/2];voices.forEach((v,i)=>{let o=modes[i*3],e=Math.min(1,Math.abs(o.x)+Math.abs(o.v)*.1);v.o.frequency.setTargetAtTime(par.p*ratios[i],now,.05);v.gain.gain.setTargetAtTime((.012+.038*e)*(.4+.6*strength),now,.06);if(v.pan)v.pan.pan.setTargetAtTime(Math.sin(i*2.4+elapsed*.1),now,.1)})}
}catch(e){fail(e)}}
requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{if(audio){if(document.hidden){voices.forEach(v=>v.gain.gain.setTargetAtTime(0,audio.currentTime,.04))}else if(playing)audio.resume().catch(fail)}});
})();
</script></body></html>
