<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#020817"><title>CAUSTIC TIDES · Repaired</title>
<style>
:root{color-scheme:dark;--a:#80e7f5;--b:#9cb6c7}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#020817;color:#e7fcff;font:12px system-ui,-apple-system,sans-serif}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:15px 17px;pointer-events:none;display:flex;justify-content:space-between;gap:12px;text-shadow:0 1px 10px #010810}h1{font-weight:600;letter-spacing:.16em;font-size:16px;margin:0 0 3px}.subtitle{color:#9ac1d2;font-size:9px;letter-spacing:.1em}#status{font:10px/1.55 ui-monospace,monospace;text-align:right;color:#95e1e8;white-space:nowrap}#touchPrompt{position:fixed;left:0;right:0;top:29%;text-align:center;pointer-events:none;color:#acdbe1;font-size:12px;letter-spacing:.08em;text-shadow:0 1px 16px #001;transition:opacity .45s}#panel{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:9px;right:9px;max-width:790px;margin:auto;padding:11px;border:1px solid #3f788b;background:rgba(3,17,30,.90);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 12px 45px #000a}.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:7px;margin-bottom:10px}button{min-height:38px;border:1px solid #488ba0;border-radius:9px;background:#153e54;color:#edffff;font:600 10px system-ui;letter-spacing:.02em;touch-action:manipulation;cursor:pointer}button:active{background:#276982}#sound{background:#176a73;border-color:#6ad6d8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 15px}label{min-width:0;color:#9dbecb;font-size:10px;display:block}label span{float:right;color:#d7ffff;font:10px ui-monospace,monospace}input[type=range]{width:100%;height:21px;display:block;accent-color:#73dde7;touch-action:pan-x}footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:#8eb1bf;font-size:9px}#message{color:#b6f0ed;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#quality{background:#0c2736;color:#bbdce5;min-height:25px;min-width:82px;font-size:9px;padding:2px 7px}@media(max-width:480px){header{padding:12px 11px}h1{font-size:14px}.subtitle{font-size:8px}#panel{padding:9px}.actions{gap:5px;margin-bottom:7px}button{font-size:9px;min-height:40px}.grid{gap:5px 8px}label{font-size:9px}label span{font-size:9px}#status{font-size:9px}footer{font-size:8px}}
</style></head><body>
<canvas id="scene" aria-label="Interactive refractive caustic field. Touch to perturb and play sounds"></canvas>
<header><div><h1>CAUSTIC TIDES <span style="color:#70d6dc">04R</span></h1><div class="subtitle">A LIVE OPTICAL INSTRUMENT</div></div><div id="status" aria-live="polite">VISUAL STARTING<br>AUDIO OFF</div></header>
<div id="touchPrompt">DRAG THE LIGHT FIELD TO BEND ITS PATHS</div>
<section id="panel" aria-label="Instrument controls"><div class="actions"><button id="sound">◉ START SOUND</button><button id="test">♪ TEST NOTE</button><button id="mode">FIELD: LENS</button><button id="auto">AUTO: OFF</button></div>
<div class="grid">
<label>REFRACTION <span id="vn">1.20</span><input id="n" aria-label="Refraction" type="range" min=".10" max="3" step=".01" value="1.20"></label>
<label>FOLDS <span id="vw">5.0</span><input id="w" aria-label="Folds" type="range" min="1" max="12" step=".1" value="5"></label>
<label>FOCUS <span id="vf">0.90</span><input id="f" aria-label="Focus" type="range" min=".1" max="2" step=".01" value=".90"></label>
<label>PITCH <span id="vp">110 Hz</span><input id="p" aria-label="Pitch" type="range" min="55" max="330" step="1" value="110"></label>
<label>RESONANCE <span id="vr">1.00</span><input id="r" aria-label="Resonance" type="range" min=".1" max="2" step=".01" value="1.00"></label>
<label>AUDIO → LIGHT <span id="vb">0.40</span><input id="b" aria-label="Audio to light feedback" type="range" min="0" max="1" step=".01" value=".40"></label></div>
<footer><div id="message" aria-live="polite">Touch the field. Press START SOUND for audio.</div><button id="quality">DETAIL: MED</button></footer></section>
<script>
(function(){'use strict';
const TAU=Math.PI*2,$=id=>document.getElementById(id),canvas=$('scene'),g=canvas.getContext('2d',{alpha:false});
let W=0,H=0,ratio=1,t=0,last=0,acc=0,frames=0,fps=0,fpstime=0,slowSeconds=0,mode=0,quality=1,auto=false,autoClock=0,drawOK=false,hits=0,hitFlash=0,eng=0,glow=0,mouseDown=false,displayError='';
let waves=[],impactX=0,impactY=0,baseLight=0,audio=null,mix=null,limiter=null,analyser=null,voices=[],soundOn=false,wasHidden=false,drawCount=0;
let values={n:1.2,w:5,f:.9,p:110,r:1,b:.4};
const sceneModes=['LENS','FOLDS','VORTEX'],details=['LOW','MED','HIGH'];
const setMessage=s=>{$('message').textContent=s};
const recalcValues=()=>{for(let id in values){let el=$(id);values[id]=+el.value;let fmt=id==='p'?Math.round(values[id])+' Hz':values[id].toFixed(id==='w'?1:2);$('v'+id).textContent=fmt;}};
for(const k in values){$(k).addEventListener('input',()=>{recalcValues();setMessage(k==='p'?'Pitch changed: '+values.p+' Hz':'Field recalculated: '+k.toUpperCase());});}recalcValues();
function resize(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);ratio=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);g.setTransform(ratio,0,0,ratio,0,0);g.fillStyle='#020817';g.fillRect(0,0,W,H);}window.addEventListener('resize',resize,{passive:true});resize();
function ripple(x,y,power){waves.push({x,y,age:0,p:power});if(waves.length>7)waves.shift();eng=Math.min(1,eng+power*.25);hits++;hitFlash=.9;impactX=x;impactY=y;$('touchPrompt').style.opacity='0';if(soundOn)pluck(x/W,power);setMessage('IMPACT '+hits+' · refractive wave injected');}
function pointer(e){let rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top};}
canvas.addEventListener('pointerdown',e=>{mouseDown=true;if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);let p=pointer(e);ripple(p.x,p.y,1);});
canvas.addEventListener('pointermove',e=>{if(!mouseDown)return;const p=pointer(e);if(drawCount++%3===0)ripple(p.x,p.y,.32);});
canvas.addEventListener('pointerup',()=>mouseDown=false);canvas.addEventListener('pointercancel',()=>mouseDown=false);
$('mode').addEventListener('click',()=>{mode=(mode+1)%3;$('mode').textContent='FIELD: '+sceneModes[mode];setMessage('Optical medium changed to '+sceneModes[mode]);});
$('auto').addEventListener('click',()=>{auto=!auto;$('auto').textContent='AUTO: '+(auto?'ON':'OFF');setMessage('Autonomous impulses '+(auto?'enabled':'disabled'));});
$('quality').addEventListener('click',()=>{quality=(quality+1)%3;$('quality').textContent='DETAIL: '+details[quality];setMessage('Renderer set to '+details[quality]);});

function setupAudio(){if(audio)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error('Web Audio is unavailable in this browser');audio=new A();mix=audio.createGain();mix.gain.value=0;limiter=audio.createDynamicsCompressor();limiter.threshold.value=-24;limiter.ratio.value=9;limiter.attack.value=.003;limiter.release.value=.16;mix.connect(limiter);analyser=audio.createAnalyser();analyser.fftSize=128;limiter.connect(analyser);analyser.connect(audio.destination);
const ratios=[1,1.25,1.5,2,2.5,3];for(let i=0;i<ratios.length;i++){let o=audio.createOscillator(),amp=audio.createGain(),pan=audio.createStereoPanner?audio.createStereoPanner():null;o.type=i%2?'triangle':'sine';amp.gain.value=.012;o.connect(amp);if(pan){amp.connect(pan);pan.pan.value=(i-2.5)/3;pan.connect(mix);}else amp.connect(mix);o.frequency.value=values.p*ratios[i];o.start();voices.push({o,amp,pan,ratio:ratios[i]});}audio.onstatechange=()=>{if(soundOn){setMessage('AudioContext: '+audio.state.toUpperCase());}};}
function audioStatus(){return !audio?'OFF':soundOn?audio.state.toUpperCase():'MUTED';}
function unlock(){try{setupAudio();const resume=audio.resume();soundOn=true;mix.gain.setTargetAtTime(.95,audio.currentTime,.05);$('sound').textContent='◉ MUTE SOUND';$('sound').style.background='#29516e';setMessage('Sound requested · '+audioStatus());if(resume&&resume.then)resume.then(()=>{setMessage('SOUND '+audio.state.toUpperCase()+' · tap TEST NOTE');}).catch(e=>{setMessage('Audio blocked: '+e.message);});}catch(e){displayError=e.message;setMessage('AUDIO ERROR: '+e.message);$('sound').textContent='AUDIO ERROR';}}
$('sound').addEventListener('click',()=>{if(!audio||!soundOn){unlock();}else{soundOn=false;mix.gain.setTargetAtTime(0,audio.currentTime,.035);$('sound').textContent='◉ START SOUND';$('sound').style.background='#176a73';setMessage('Audio muted · visualization continues');}});
function pluck(pan=0.5,power=1){if(!audio||!soundOn)return;try{let when=audio.currentTime,o=audio.createOscillator(),a=audio.createGain(),st=audio.createStereoPanner?audio.createStereoPanner():null,f=values.p*Math.pow(2,Math.round(pan*12)/12)*2;o.type='sine';o.frequency.setValueAtTime(f,when);o.frequency.exponentialRampToValueAtTime(f*.68,when+.45);a.gain.setValueAtTime(.00001,when);a.gain.exponentialRampToValueAtTime(.11*Math.max(.2,power),when+.014);a.gain.exponentialRampToValueAtTime(.00001,when+1.2);o.connect(a);if(st){a.connect(st);st.pan.value=pan*2-1;st.connect(mix)}else a.connect(mix);o.start(when);o.stop(when+1.23);o.onended=()=>{o.disconnect();a.disconnect();if(st)st.disconnect()};}catch(e){setMessage('Tone failed: '+e.message);}}
$('test').addEventListener('click',()=>{if(!soundOn){unlock();}pluck(.5,1.4);ripple(W*.5,H*.42,.8);setMessage('TEST NOTE PLAYED · audio state '+audioStatus());});
function fieldGrad(x,y,R,out){const fx=(x-W*.5)/R,fy=(y-H*.42)/R,r2=fx*fx+fy*fy,s=Math.max(.3,values.f),w=values.w;
let gx=0,gy=0,phi=0;
if(mode===0){let a=Math.exp(-s*r2*1.65),m=1+.2*Math.cos(w*Math.atan2(fy,fx)+t*.26);phi=a*m;gx=-3.3*s*fx*phi;gy=-3.3*s*fy*phi;}
else if(mode===1){let a=fx*w*.9+Math.sin(fy*w*.4+t*.2)*1.1,da=w*.9,db=Math.cos(fy*w*.4+t*.2)*w*.44;phi=Math.sin(a)*Math.cos(fy*w*.25);gx=Math.cos(a)*da*Math.cos(fy*w*.25);gy=Math.cos(a)*db*Math.cos(fy*w*.25)-Math.sin(a)*Math.sin(fy*w*.25)*w*.25;}
else{let rad=Math.sqrt(r2+.02),theta=Math.atan2(fy,fx),u=w*theta-rad*7+t*.25,e=Math.exp(-rad*.8);phi=e*Math.cos(u);let dr=-.8*e*Math.cos(u)+7*e*Math.sin(u),dth=-w*e*Math.sin(u),inv=1/(rad||1);gx=dr*fx*inv+dth*(-fy)/(r2+.02);gy=dr*fy*inv+dth*fx/(r2+.02);}
for(let i=0;i<waves.length;i++){let a=waves[i],dx=(x-a.x)/R,dy=(y-a.y)/R,rad=Math.sqrt(dx*dx+dy*dy+.0001),d=rad-a.age*.44,ga=Math.exp(-d*d*17)*Math.exp(-a.age*.8)*a.p,deriv=-34*d*ga;phi+=ga;gx+=deriv*dx/rad;gy+=deriv*dy/rad;}
out[0]=gx*values.n*.24*(1+values.b*glow);out[1]=gy*values.n*.24*(1+values.b*glow);return phi;}
const grad=[0,0];
function draw(){if(W<=1||H<=1)return;const cx=W*.5,cy=H*.42,R=Math.min(W*.48,H*.34);g.fillStyle='rgba(2,8,23,.26)';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';
let count=[104,184,260][quality],steps=[12,14,16][quality],sumx=0,sumy=0;const scale=R/steps;
for(let j=0;j<count;j++){let ang=TAU*j/count,ax=Math.cos(ang),ay=Math.sin(ang),x=cx+R*ax,y=cy+R*ay,vx=-ax,vy=-ay,bright=0;g.beginPath();g.moveTo(x,y);for(let k=0;k<steps;k++){fieldGrad(x,y,R,grad);vx+=grad[0]*.063;vy+=grad[1]*.063;let norm=Math.hypot(vx,vy)||1;vx/=norm;vy/=norm;x+=vx*scale;y+=vy*scale;bright+=Math.abs(grad[0])+Math.abs(grad[1]);if(!(k&1))g.lineTo(x,y);}let h=(175+155*j/count+20*Math.sin(t*.25))%360;g.strokeStyle='hsla('+h+',95%,70%,'+Math.min(.19,.025+bright*.012)+')';g.lineWidth=.65+Math.min(1.3,bright*.07);g.stroke();sumx+=x;sumy+=y;if(!(j%4)){g.beginPath();g.arc(x,y,1.3+Math.min(2,bright*.12),0,TAU);g.fillStyle='hsla('+h+',100%,83%,.38)';g.fill();}}
g.globalCompositeOperation='source-over';
for(let i=0;i<waves.length;i++){let a=waves[i],r=R*a.age*.44;g.beginPath();g.arc(a.x,a.y,Math.max(1,r),0,TAU);g.strokeStyle='rgba(120,246,250,'+(Math.max(0,.55-a.age*.24)*a.p)+')';g.lineWidth=1.2+2*a.p;g.stroke();}
if(hitFlash>0){let r=16+28*(1-hitFlash);g.beginPath();g.arc(impactX,impactY,r,0,TAU);g.strokeStyle='rgba(198,255,255,'+hitFlash*.7+')';g.lineWidth=2;g.stroke();}if(eng>.01){let glowR=g.createRadialGradient(cx,cy,2,cx,cy,R*.85);glowR.addColorStop(0,'rgba(23,110,141,'+Math.min(.18,eng*.14)+')');glowR.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glowR;g.fillRect(cx-R,cy-R,R*2,R*2);}return {x:(sumx/count-cx)/R,y:(sumy/count-cy)/R};}
function synth(step){if(!audio||!soundOn)return;let now=audio.currentTime;voices.forEach((v,i)=>{let waveMod=Math.sin(t*(.21+i*.06)+eng*5);let p=values.p*v.ratio*(1+.004*waveMod+.003*glow);v.o.frequency.setTargetAtTime(p,now,.065);v.amp.gain.setTargetAtTime((.012+.006*eng+.003*waveMod)*values.r,now,.11);if(v.pan)v.pan.pan.setTargetAtTime(Math.sin(t*.16+i*2.3)*.85,now,.12);});}
function loop(ms){requestAnimationFrame(loop);let dt=Math.min(.05,Math.max(0,(ms-last)/1000||.016));last=ms;t+=dt;acc+=dt;fpstime+=dt;if(fpstime>=1){fps=Math.round(frames/fpstime);if(fps<16&&quality>0){slowSeconds++;if(slowSeconds>=2){quality=0;$('quality').textContent='DETAIL: LOW';setMessage('Adaptive quality: switched to LOW for responsiveness');slowSeconds=0;}}else slowSeconds=0;fpstime=0;frames=0;}
eng*=Math.exp(-dt*.63);hitFlash=Math.max(0,hitFlash-dt*1.6);autoClock+=dt;if(auto&&autoClock>1.1){autoClock=0;ripple(W*(.2+Math.random()*.6),H*(.14+Math.random()*.47),.7)}for(let a of waves)a.age+=dt;waves=waves.filter(a=>a.age<4);
if(analyser&&soundOn&&drawCount%5===0){let ar=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(ar);let v=0;for(let z of ar)v+=z;glow+=(v/ar.length/255-glow)*.06;}
synth(dt);
if(acc>=1/30){acc=0;try{draw();frames++;drawOK=true;}catch(e){displayError='VISUAL ERROR: '+e.message;setMessage(displayError);drawOK=false;}}
if(!(drawCount++%15))$('status').textContent=(drawOK?'VISUAL LIVE':'VISUAL ERROR')+' · '+fps+' FPS\nAUDIO '+audioStatus()+' · HITS '+hits;}
window.addEventListener('error',e=>{displayError=e.message;setMessage('ERROR: '+e.message);$('status').textContent='ERROR '+e.message;});
document.addEventListener('visibilitychange',()=>{if(audio&&soundOn){mix.gain.setTargetAtTime(document.hidden?0:.95,audio.currentTime,.06);if(!document.hidden&&audio.state!=='running'){audio.resume().catch(()=>setMessage('Tap START SOUND to restore audio'));}}});
requestAnimationFrame(loop);setMessage('Ready · the light field is interactive');
window.CAUSTIC_DIAGNOSTICS=()=>({frames:fps,renders:drawCount,hits,waves:waves.length,mode:sceneModes[mode],quality:details[quality],soundOn,audioState:audio?audio.state:'off',status:displayError||'ok'});
})();
</script></body></html>
