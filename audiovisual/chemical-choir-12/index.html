<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHEMICAL CHOIR 12</title><style>body{margin:0;background:#080c19;color:#e8f4ff;font:14px system-ui}header{padding:12px 16px}h1{font-size:21px;margin:2px 0}small{color:#a6c5d6}canvas{display:block;width:100%;height:min(55vh,500px);touch-action:none;background:#030713}section{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#c9e6ed}input{width:100%;accent-color:#6df3d7}button{background:#193a4a;color:white;border:1px solid #55b8bd;border-radius:9px;padding:13px;font-weight:700;min-height:48px}#status{position:sticky;top:0;background:#10212c;padding:8px 12px;z-index:2;font:12px monospace}footer{padding:15px;color:#9fb8c5}a{color:#86e2ee}</style><div id="status">FPS: -- | Audio: locked | Error: none</div><header><h1>CHEMICAL CHOIR 12</h1><small>Excitable-media reaction waves become polyphonic pulses. Tap or drag the liquid to seed a wave.</small></header><canvas id="field"></canvas><section><button id="test">▶ TEST NOTE / START SOUND</button><button id="seed">✺ NEW REACTION</button><label>Excitability <output id="vexc">50</output><input id="exc" type="range" min="10" max="90" value="50"></label><label>Wave diffusion <output id="vdiff">45</output><input id="diff" type="range" min="10" max="90" value="45"></label><label>Musical pitch <output id="vpitch">55</output><input id="pitch" type="range" min="20" max="90" value="55"></label><label>Pulse density <output id="vdensity">45</output><input id="density" type="range" min="10" max="90" value="45"></label><label>Brightness <output id="vbright">60</output><input id="bright" type="range" min="10" max="90" value="60"></label><label>Volume <output id="vvol">35</output><input id="vol" type="range" min="0" max="70" value="35"></label></section><footer>Inspired by chemical excitable media, not a calibrated Oregonator. <a href="https://doi.org/10.1103/PhysRevE.60.1512">Kettunen et al., Phys. Rev. E (1999)</a> · <a href="https://doi.org/10.1103/PhysRevA.41.5418">Kessler & Levine (1990)</a></footer><script>
(()=>{'use strict';const N=104,M=104,S=N*M,cv=document.getElementById('field'),ctx=cv.getContext('2d',{alpha:false}),off=document.createElement('canvas');off.width=N;off.height=M;const ox=off.getContext('2d');let a=new Float32Array(S),b=new Float32Array(S),next=new Float32Array(S),frame=0,fps=0,last=performance.now(),audio=null,gain=null,err='none',active=0,lastNote=0;const $=id=>document.getElementById(id),val=id=>+$(id).value;['exc','diff','pitch','density','bright','vol'].forEach(id=>$(id).addEventListener('input',()=>{$('v'+id).textContent=val(id);if(gain)gain.gain.setTargetAtTime(val('vol')/1000,audio.currentTime,.03)}));function status(){ $('status').textContent='FPS: '+fps+' | Audio: '+(audio?audio.state:'locked')+' | Error: '+err }function fail(e){err=String(e.message||e).slice(0,100);status()}window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));function pulse(x,y,r=4){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){let xx=x+dx,yy=y+dy;if(xx>1&&xx<N-2&&yy>1&&yy<M-2&&dx*dx+dy*dy<=r*r){let i=yy*N+xx;a[i]=1;b[i]=0}}}function seed(){a.fill(0);b.fill(0);for(let j=0;j<9;j++)pulse(8+Math.random()*(N-16)|0,8+Math.random()*(M-16)|0,2+Math.random()*4|0)}seed();$('seed').onclick=seed;function note(freq=330,duration=.33,amp=.45){if(!audio||audio.state!=='running')return;let t=audio.currentTime,o=audio.createOscillator(),v=audio.createGain(),filter=audio.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(freq,t);filter.type='lowpass';filter.frequency.value=500+val('bright')*55;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(Math.max(.001,amp*.15),t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(filter).connect(v).connect(gain);o.start(t);o.stop(t+duration+.02)}async function start(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=val('vol')/1000;gain.connect(audio.destination)}await audio.resume();note(440,.55,.85);status()}catch(e){fail(e)}}$('test').addEventListener('click',start);function touch(e){e.preventDefault();let r=cv.getBoundingClientRect(),x=Math.max(2,Math.min(N-3,((e.clientX-r.left)/r.width*N)|0)),y=Math.max(2,Math.min(M-3,((e.clientY-r.top)/r.height*M)|0));pulse(x,y,4);if(audio&&audio.state==='running')note(180+((x+y)%17)*23,.25,.55)}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);touch(e)});cv.addEventListener('pointermove',e=>{if(e.buttons)touch(e)});function step(){let diffusion=val('diff')/90,threshold=.20+(90-val('exc'))/250;let events=0;for(let y=1;y<M-1;y++)for(let x=1;x<N-1;x++){let i=y*N+x,u=a[i],refr=b[i],neighbors=(a[i-1]+a[i+1]+a[i-N]+a[i+N])*.25;let drive=neighbors*diffusion;if(u<.18&&refr<.28&&drive>threshold){next[i]=1;events++}else next[i]=Math.max(0,u-.095);b[i]=Math.min(1,refr*.986+u*.085)}let t=a;a=next;next=t;if(audio&&audio.state==='running'&&events>val('density')*.18&&performance.now()-lastNote>110){let scale=[0,3,5,7,10,12,15,17];note(110*Math.pow(2,(scale[(events+frame)%scale.length]+val('pitch')/9)/12),.2,Math.min(.7,events/150));lastNote=performance.now()} }const im=ox.createImageData(N,M);function draw(){for(let i=0;i<S;i++){let v=a[i],q=b[i],k=i*4;im.data[k]=Math.min(255,8+v*220+q*70);im.data[k+1]=Math.min(255,12+v*170+q*30);im.data[k+2]=Math.min(255,30+v*100+q*140);im.data[k+3]=255}ox.putImageData(im,0,0);let dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=w*dpr;cv.height=h*dpr}ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,cv.width,cv.height)}function loop(now){try{if(frame%2===0){step();draw()}frame++;if(now-last>1000){fps=Math.round(frame*1000/(now-last));frame=0;last=now;status()}}catch(e){fail(e)}requestAnimationFrame(loop)}requestAnimationFrame(loop);status()})();
</script></html>
