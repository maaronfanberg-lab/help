<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEAM BLOOM 06</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020914;color:#e5ffff;font:12px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:17px;letter-spacing:.15em;margin:0}small{color:#92c3d3;font-size:10px}#status{font:10px/1.6 monospace;text-align:right;color:#8effdf;white-space:pre-line}#err{display:none;position:fixed;top:68px;left:12px;right:12px;background:#5a2434;padding:9px;border-radius:8px;z-index:9}section{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;max-width:760px;margin:auto;padding:10px;background:#081827ed;border:1px solid #3e879a;border-radius:15px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}button{background:#164357;border:1px solid #4b91a6;border-radius:9px;color:white;padding:10px 2px;min-height:40px;font:11px system-ui;touch-action:manipulation}#start{background:#11676e}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}label{font-size:10px;color:#b0c9d7}output{float:right;color:#78f1eb}input{display:block;width:100%;accent-color:#5ee5e9;height:23px}footer{margin-top:7px;font-size:9px;color:#92b8c6}@media(max-width:440px){h1{font-size:14px}button{font-size:9px}.grid{gap:5px}label{font-size:9px}}</style></head><body><canvas id="c"></canvas><header><div><h1>BEAM BLOOM 06</h1><small>PHASED-ARRAY INTERFERENCE ORGAN</small></div><div id="status">STARTING</div></header><div id="err"></div><section><div class="buttons"><button id="start">▶ SOUND</button><button id="test">♪ TEST NOTE</button><button id="mode">BLOOM</button><button id="auto">AUTO OFF</button></div><div class="grid"><label>STEER <output id="oa">0°</output><input id="a" type="range" min="-80" max="80" value="0"></label><label>SPACING λ <output id="od">0.50</output><input id="d" type="range" min=".15" max="1.5" step=".01" value=".5"></label><label>ELEMENTS <output id="on">8</output><input id="n" type="range" min="2" max="16" value="8"></label><label>PITCH <output id="of">160</output><input id="f" type="range" min="80" max="440" value="160"></label><label>HARMONICS <output id="oh">0.55</output><input id="h" type="range" min="0" max="1" step=".01" value=".55"></label><label>FEEDBACK <output id="ob">0.45</output><input id="b" type="range" min="0" max="1" step=".01" value=".45"></label></div><footer id="msg">TOUCH THE FIELD · PRESS TEST NOTE FOR AUDIO</footer></section><script>
(function(){'use strict';var E=function(x){return document.getElementById(x)},c=E('c'),g=c.getContext('2d'),P={},keys=['a','d','n','f','h','b'],W=1,H=1,D=1,t=0,last=0,frames=0,fps=0,quality=1,mode=0,auto=false,drag=false,autoT=0,rings=[],audio=null,master=null,an=null,voices=[],playing=false,level=0,TAU=Math.PI*2;
function fail(e){E('err').style.display='block';E('err').textContent='ERROR: '+(e.message||e);E('msg').textContent='ERROR: SEE ABOVE';console.error(e)}window.addEventListener('error',function(e){fail(e.error||e.message)});window.addEventListener('unhandledrejection',function(e){fail(e.reason)});
keys.forEach(function(k){var el=E(k);P[k]=+el.value;el.addEventListener('input',function(){P[k]=+el.value;E('o'+k).textContent=k==='a'?P[k]+'°':k==='n'||k==='f'?P[k]:P[k].toFixed(2);E('msg').textContent=k.toUpperCase()+' CHANGED'})});
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);g.fillStyle='#020914';g.fillRect(0,0,W,H)}window.addEventListener('resize',resize);resize();
function touch(x,y){P.a=Math.round(Math.max(-80,Math.min(80,Math.atan2(x-W/2,H*.4-y)*180/Math.PI)));E('a').value=P.a;E('oa').textContent=P.a+'°';rings.push({x:x,y:y,r:1,l:1});if(rings.length>12)rings.shift();E('msg').textContent='TOUCH STEERED '+P.a+'°';if(audio&&playing)note(.3)}
c.addEventListener('pointerdown',function(e){drag=true;c.setPointerCapture(e.pointerId);touch(e.clientX,e.clientY)});c.addEventListener('pointermove',function(e){if(drag)touch(e.clientX,e.clientY)});c.addEventListener('pointerup',function(){drag=false});c.addEventListener('pointercancel',function(){drag=false});
E('mode').onclick=function(){mode=(mode+1)%3;E('mode').textContent=['BLOOM','RIBBONS','POLAR'][mode];E('msg').textContent='MODE '+E('mode').textContent};E('auto').onclick=function(){auto=!auto;E('auto').textContent=auto?'AUTO ON':'AUTO OFF'};
async function init(){if(!audio){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio unavailable');audio=new AC();master=audio.createGain();master.gain.value=0;var comp=audio.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=9;master.connect(comp);an=audio.createAnalyser();an.fftSize=128;comp.connect(an);an.connect(audio.destination);for(var i=0;i<16;i++){var o=audio.createOscillator(),v=audio.createGain(),p=audio.createStereoPanner?audio.createStereoPanner():null;o.type=i%3===0?'triangle':'sine';v.gain.value=0;o.connect(v);if(p){v.connect(p);p.connect(master)}else v.connect(master);o.start();voices.push({o:o,v:v,p:p})}}await audio.resume()}
function note(s){var now=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.setValueAtTime(P.f*2,now);o.frequency.exponentialRampToValueAtTime(P.f*1.5,now+.18);v.gain.setValueAtTime(.0001,now);v.gain.exponentialRampToValueAtTime(.13*s,now+.015);v.gain.exponentialRampToValueAtTime(.0001,now+.65);o.connect(v);v.connect(master);o.start(now);o.stop(now+.7)}
E('start').onclick=async function(){try{await init();playing=!playing;master.gain.setTargetAtTime(playing?.65:0,audio.currentTime,.05);E('start').textContent=playing?'■ MUTE':'▶ SOUND';if(playing)note(.8);E('msg').textContent=playing?'SOUND RUNNING':'MUTED'}catch(e){fail(e)}};
E('test').onclick=async function(){try{await init();playing=true;master.gain.setTargetAtTime(.65,audio.currentTime,.05);E('start').textContent='■ MUTE';note(1);E('msg').textContent='TEST NOTE TRIGGERED · '+audio.state}catch(e){fail(e)}};
function af(a,steer,n,d){var delta=TAU*d*(Math.sin(a)-Math.sin(steer)),re=0,im=0;for(var i=0;i<n;i++){var ph=(i-(n-1)/2)*delta;re+=Math.cos(ph);im+=Math.sin(ph)}return Math.hypot(re,im)/n}
function paint(ms){requestAnimationFrame(paint);var dt=Math.min(.06,(ms-last)/1000||.016);last=ms;t+=dt;frames++;if(frames%25===0){fps=Math.round(1/Math.max(.001,dt));quality=fps<25?.45:fps<40?.7:1}if(auto){autoT+=dt;if(autoT>.9){autoT=0;P.a=Math.round(65*Math.sin(t*.4));E('a').value=P.a;E('oa').textContent=P.a+'°';rings.push({x:W/2+W*.2*Math.sin(t),y:H*.4,r:1,l:1})}}
if(an&&playing){var b=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(b);var sum=0;for(var i=0;i<b.length;i++)sum+=b[i];level+=(sum/b.length/255-level)*.08}else level*=.96;
g.fillStyle='rgba(2,9,20,.23)';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';var cx=W/2,cy=H*.4,R=Math.min(W*.47,H*.33),steer=P.a*Math.PI/180,N=P.n,steps=Math.round(220*quality),layers=Math.round((mode===1?6:9)*quality);
for(var j=0;j<layers;j++){g.beginPath();for(var k=0;k<=steps;k++){var th=-Math.PI+TAU*k/steps,amp=af(th,steer,N,P.d),a=th+Math.PI/2,rad=R*(.38+j*.065+amp*(mode===1?.25:.6))*(1+P.b*level*.6),x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;if(mode===1){x+=Math.cos(th*3+j*.6+t*.3)*R*.04;y+=Math.sin(th*4+j*.4+t*.2)*R*.04}if(k===0)g.moveTo(x,y);else g.lineTo(x,y)}g.closePath();g.strokeStyle='hsla('+((j*28+t*9+180)%360)+',95%,70%,'+(.09+level*.12)+')';g.lineWidth=1;g.stroke()}
for(var i=0;i<N;i++){var xx=cx+(i-(N-1)/2)*Math.min(23,W*.7/N);g.beginPath();g.arc(xx,cy+R*.87,2.7,0,TAU);g.fillStyle='#adffff';g.fill()}
for(var i=0;i<rings.length;i++){var z=rings[i];z.r+=dt*120;z.l-=dt*.8;g.beginPath();g.arc(z.x,z.y,z.r,0,TAU);g.strokeStyle='rgba(120,255,235,'+Math.max(0,z.l*.5)+')';g.stroke()}rings=rings.filter(function(z){return z.l>0});g.globalCompositeOperation='source-over';
if(audio&&playing){var now=audio.currentTime;voices.forEach(function(v,i){var on=i<N,phase=TAU*P.d*(i-(N-1)/2)*Math.sin(steer),ratio=[1,1.25,1.5,2][i%4];v.o.frequency.setTargetAtTime(P.f*ratio,now,.08);v.v.gain.setTargetAtTime(on?(.003+.004*P.h)*(1+.5*Math.sin(t*1.7+phase)):0,now,.07);if(v.p)v.p.pan.setTargetAtTime(Math.sin(steer)*.75,now,.1)})}
if(frames%25===0)E('status').textContent='VISUAL LIVE\nAUDIO '+(audio?(playing?audio.state.toUpperCase():'MUTED'):'OFF')+'\nFPS '+fps+' · '+N+' SOURCES'}
requestAnimationFrame(paint);document.addEventListener('visibilitychange',function(){if(audio)master.gain.setTargetAtTime(document.hidden?0:playing?.65:0,audio.currentTime,.05)});
})();
</script></body></html>
