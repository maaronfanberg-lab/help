text('20 COUPLED MASSES',right,14,'#93b9bc',9,'right');
line(left,chainY,right,chainY,'#245665',1.1);
for(let j=0;j<N;j++){
 const val=sample(j,simTime),active=clamp((val-.10)/.72,0,1);
 const yy=chainY-15*val;
 line(xj(j),chainY+8,xj(j),yy+1,`rgba(72,166,164,${.14+.56*active})`,1);
 if(j<N-1){const next=sample(j+1,simTime);line(xj(j),yy,xj(j+1),chainY-15*next,`rgba(101,209,201,${.22+.6*Math.max(active,clamp((next-.1)/.72,0,1))})`,1.2)}
 ctx.beginPath();ctx.arc(xj(j),yy,2.7+3.4*active,0,Math.PI*2);
 ctx.fillStyle=`rgba(129,231,219,${.24+.73*active})`;ctx.fill();
 if(active>.7){ctx.beginPath();ctx.arc(xj(j),yy,7.5,0,Math.PI*2);ctx.strokeStyle=`rgba(122,223,214,${.3*active})`;ctx.lineWidth=1;ctx.stroke();}
}
text('01',left,chainY+22,'#b5e1df',9);text('20',right,chainY+22,'#b5e1df',9,'right');
// Measured spacetime plot. x=mass index; y=time history. Nothing is painted
// downstream of an extinguished pulse if the ODE did not propagate it.
line(left,fallTop-7,right,fallTop-7,'#25424b',.8);
text('SPACETIME FLOW',left,fallTop-12,'#96bfc2',9);
text('NOW',right,fallTop-12,'#96bfc2',9,'right');
const win=32, rows=Math.max(45,Math.min(155,Math.round(fallH*0.9))),dx=ww/(N-1),dy=fallH/rows;
for(let row=0;row<rows;row++){
 const tt=simTime-win+win*(row+.5)/rows; if(tt<T0)continue;
 const y=fallBot-(row+1)*dy;
 for(let j=0;j<N;j++){
   const v=sample(j,tt),bright=clamp((v-.14)/.73,0,1);
   if(bright<.012)continue;
   const a=.06+.91*Math.pow(bright,1.25);
   ctx.fillStyle=`rgba(99,220,205,${a.toFixed(3)})`;
   ctx.fillRect(xj(j)-dx*.35,y,dx*.70,dy+0.35);
 }
}
for(let j=0;j<N;j+= (w<460?5:4)){
 line(xj(j),fallTop,xj(j),fallBot,'rgba(77,132,141,.14)',.65);
 text(String(j+1).padStart(2,'0'),xj(j),fallBot+11,'#719b9d',8,'center');
}
// An annotation is attached to the third peak's measured extinction near unit 2.
const stopT=473.9, yy=fallBot-(stopT-(simTime-win))/win*fallH;
if(yy>fallTop+3&&yy<fallBot-2){
 ctx.beginPath();ctx.arc(xj(1),yy,6.5,0,2*Math.PI);ctx.strokeStyle='#ffca83';ctx.lineWidth=1.5;ctx.stroke();
 line(xj(1)+8,yy,xj(1)+48,yy-10,'#b78e5d',.8);
 text('PULSE LOST',xj(1)+52,yy-12,'#f2c58f',9);
}
// Actual source / exit spike events, graphed against the SAME time axis.
const timelineTop=fallBot+21,timelineH=h-timelineTop-4, mid=timelineTop+timelineH/2;
if(timelineH>19){
 text('DRIVE',left-5,timelineTop+7,'#8bded5',8,'right');
 text('OUT',left-5,mid+7,'#f6ca8e',8,'right');
 const range=27;
 const sx=tt=>left+(tt-(simTime-range))*ww/range;
 const base1=timelineTop+7, base2=mid+7;
 line(left,base1,right,base1,'#23414a',.8);line(left,base2,right,base2,'#23414a',.8);
 for(const [evs,base,col] of [[drive,base1,'#82dacd'],[receive,base2,'#e1b17a']]){
   for(const [tt,amp] of evs){const xx=sx(tt);if(xx<left||xx>right)continue;
     line(xx,base,xx,base-7*(amp/.9),col,1.4);
   }
 }
 // predicted missing downstream event aligned to observed source input, not an audible note
 if(EXPECTED<simTime&&EXPECTED>simTime-range){const xx=sx(EXPECTED);
  ctx.setLineDash([2,2]);ctx.strokeStyle='#edb77b';ctx.lineWidth=1;ctx.strokeRect(xx-3.5,base2-10,7,11);ctx.setLineDash([]);
 }
 line(right,base1-12,right,base2+3,'#f5e5c9',1);
}
// Progress, driven by real simulation time rather than decor.
ctx.fillStyle='#10252e';ctx.fillRect(0,h-2,w,2);ctx.fillStyle='#92d8c9';ctx.fillRect(0,h-2,w*clamp((simTime-START)/(END-START),0,1),2);
}
function initAudio(){if(audio)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){status.textContent='SOUND NOT SUPPORTED';return;}
 audio=new AC();master=audio.createGain();master.gain.value=.52;master.connect(audio.destination);
}
function strike(kind,velocity){if(!audio||muted||audio.state!=='running')return;
 const now=audio.currentTime+.015,isOut=kind==='out',dur=isOut?.32:.105;
 const gain=audio.createGain(),osc=audio.createOscillator(),filter=audio.createBiquadFilter();
 osc.type=isOut?'sine':'triangle';
 const f=isOut?55+velocity*78:340+velocity*128;
 osc.frequency.setValueAtTime(f*(isOut?1.6:1.24),now);
 osc.frequency.exponentialRampToValueAtTime(f,now+.055);
 filter.type='lowpass';filter.frequency.value=isOut?800:2600;
 gain.gain.setValueAtTime(.0001,now);
 gain.gain.exponentialRampToValueAtTime((isOut?.49:.15)*clamp(velocity/.87,.3,1.25),now+.008);
 gain.gain.exponentialRampToValueAtTime(.0001,now+dur);
 osc.connect(filter);filter.connect(gain);gain.connect(master);
 osc.start(now);osc.stop(now+dur+.01);
 // A brief high transient gives the received bass a tactile attack even on phone speakers.
 if(isOut){const click=audio.createOscillator(),cg=audio.createGain();click.type='triangle';click.frequency.setValueAtTime(245,now);click.frequency.exponentialRampToValueAtTime(100,now+.035);cg.gain.setValueAtTime(.06,now);cg.gain.exponentialRampToValueAtTime(.0001,now+.04);click.connect(cg);cg.connect(master);click.start(now);click.stop(now+.05);}
}
function cycle(ms){if(!playing)return;
 const delta=lastMS?Math.min((ms-lastMS)/1000,.11):0;lastMS=ms;
 const old=simTime;simTime=Math.min(END,simTime+delta*3.0*speed);
 for(const [type,events,seen] of [['in',drive,playedDrive],['out',receive,playedRecv]]){
  for(let k=0;k<events.length;k++){const [tt,vel]=events[k];if(tt>old&&tt<=simTime&&!seen.has(k)){seen.add(k);strike(type,vel);}}
 }
 draw();
 if(simTime>=END){playing=false;done=true;playBtn.textContent='▶ Play again';status.textContent='PASSAGE COMPLETE';return;}
 raf=requestAnimationFrame(cycle);
}
async function start(reset=false){
 if(playing&&!reset){playing=false;cancelAnimationFrame(raf);lastMS=0;playBtn.textContent='▶ Resume';status.textContent='PAUSED';return;}
 if(reset||done){simTime=START;playedDrive.clear();playedRecv.clear();done=false;}
 initAudio();
 if(audio){try{await audio.resume();liveSound=audio.state==='running';}catch(err){liveSound=false;status.textContent='AUDIO UNAVAILABLE';}}
 playing=true;lastMS=0;playBtn.textContent='Ⅱ Pause';status.textContent=liveSound?(muted?'PLAYING · MUTED':'LIVE · SOUND ACTIVE'):'PLAYING · VISUAL ONLY';
 cancelAnimationFrame(raf);raf=requestAnimationFrame(cycle);
}
playBtn.addEventListener('click',()=>start(false));
replayBtn.addEventListener('click',()=>start(true));
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'Sound off':'Sound on';muteBtn.setAttribute('aria-pressed',String(muted));status.textContent=muted?'PLAYING · MUTED':(playing?'LIVE · SOUND ACTIVE':'RECORDING READY');});
speedEl.addEventListener('input',()=>{speed=+speedEl.value;speedVal.textContent=speed.toFixed(2)+'×';});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){playing=false;cancelAnimationFrame(raf);lastMS=0;playBtn.textContent='▶ Resume';status.textContent='PAUSED · BACKGROUND';}});
resize();
</script>
</body>
