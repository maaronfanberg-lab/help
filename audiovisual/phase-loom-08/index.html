<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phase Loom 08</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020611;color:#ddfaff;font:12px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:16px;letter-spacing:3px;margin:0}small{font-size:9px;color:#9bc5cf}#status{white-space:pre;text-align:right;font:10px monospace}section{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;max-width:750px;margin:auto;background:#071725ed;border:1px solid #39798d;border-radius:14px;padding:10px}.buttons,.grid{display:grid;gap:7px;grid-template-columns:repeat(4,minmax(0,1fr))}.buttons{margin-bottom:9px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}button{min-height:42px;background:#174158;border:1px solid #4b91a3;border-radius:9px;color:#eaffff;font:600 10px system-ui}#sound{background:#116e73}label{font-size:10px;color:#a7c9d6}input{width:100%;accent-color:#72e2e5}#message{font-size:10px;color:#9fefdf;margin-top:7px}@media(max-width:420px){h1{font-size:13px}label{font-size:9px}section{padding:8px}}</style></head><body><canvas id="c"></canvas><header><div><h1>PHASE LOOM / 08</h1><small>LISSAJOUS RESONANCE ORGAN</small></div><div id="status">FPS -- | AUDIO OFF\nERROR NONE</div></header><section><div class="buttons"><button id="sound">START SOUND</button><button id="test">♪ TEST NOTE</button><button id="ratio">RATIO 3:2</button><button id="motion">MOTION ON</button></div><div class="grid"><label>X FREQUENCY<input id="x" type="range" min="1" max="9" value="3"></label><label>Y FREQUENCY<input id="y" type="range" min="1" max="9" value="2"></label><label>PHASE<input id="phase" type="range" min="0" max="6.28" step=".01" value="1.57"></label><label>BASE PITCH<input id="pitch" type="range" min="80" max="360" value="160"></label><label>SPREAD<input id="spread" type="range" min=".2" max="1" step=".01" value=".85"></label><label>FEEDBACK<input id="feed" type="range" min="0" max="1" step=".01" value=".3"></label></div><div id="message">Touch the field to bend its phase. Press TEST NOTE for sound.</div></section><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let W,H,D,last=0,t=0,fps=0,frames=0,secs=0,flash=0,dx=0,dy=0,drag=false,motion=true,mode=0,ac=null,master=null,voices=[],playing=false,error='NONE',an=null,level=0;const p={};for(const k of ['x','y','phase','pitch','spread','feed']){const el=$(k);p[k]=+el.value;el.addEventListener('input',()=>{p[k]=+el.value;$('message').textContent=k.toUpperCase()+' = '+p[k];flash=1;if(ac&&playing)note(.35)})}function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);g.fillStyle='#020611';g.fillRect(0,0,W,H)}addEventListener('resize',resize);resize();function fail(e){error=String(e&&e.message||e).slice(0,36);$('message').textContent='ERROR: '+error;$('status').style.color='#ff8195'}window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));function init(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio unavailable');ac=new AC();master=ac.createGain();master.gain.value=0;let comp=ac.createDynamicsCompressor();comp.threshold.value=-23;comp.ratio.value=8;master.connect(comp);an=ac.createAnalyser();an.fftSize=64;comp.connect(an);an.connect(ac.destination);for(let i=0;i<4;i++){let o=ac.createOscillator(),gain=ac.createGain(),pan=ac.createStereoPanner?ac.createStereoPanner():null;o.type=i?'sine':'triangle';gain.gain.value=0;o.connect(gain);if(pan){gain.connect(pan);pan.connect(master)}else gain.connect(master);o.start();voices.push({o,gain,pan})}}function note(power=1){if(!ac)return;const now=ac.currentTime,ratios=[1,p.y/p.x,2,p.x/p.y];voices.forEach((v,i)=>{v.o.frequency.setTargetAtTime(Math.min(1500,Math.max(55,p.pitch*ratios[i])),now,.02);v.gain.gain.cancelScheduledValues(now);v.gain.gain.setValueAtTime(.0001,now);v.gain.gain.linearRampToValueAtTime((i===0?.11:.035)*power,now+.025);v.gain.gain.exponentialRampToValueAtTime(.0001,now+1.5);if(v.pan)v.pan.pan.setValueAtTime([-0.8,.8,-.3,.3][i],now)});flash=1}async function start(){try{init();await ac.resume();playing=!playing;master.gain.setTargetAtTime(playing?.75:0,ac.currentTime,.03);$('sound').textContent=playing?'MUTE SOUND':'START SOUND';if(playing)note(.8);$('message').textContent=playing?'AUDIO RUNNING':'AUDIO MUTED'}catch(e){fail(e)}}$('sound').onclick=start;$('test').onclick=async()=>{try{init();await ac.resume();playing=true;master.gain.setTargetAtTime(.75,ac.currentTime,.02);$('sound').textContent='MUTE SOUND';note();$('message').textContent='TEST NOTE TRIGGERED'}catch(e){fail(e)}};$('ratio').onclick=()=>{mode=(mode+1)%5;let r=[[3,2],[5,4],[7,3],[8,5],[1,1]][mode];p.x=r[0];p.y=r[1];$('x').value=p.x;$('y').value=p.y;$('ratio').textContent='RATIO '+p.x+':'+p.y;flash=1;if(ac&&playing)note(.5)};$('motion').onclick=()=>{motion=!motion;$('motion').textContent=motion?'MOTION ON':'MOTION OFF'};c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);dx=e.clientX/W-.5;dy=e.clientY/H-.4;p.phase=(p.phase+dx*2+6.283)%6.283;$('phase').value=p.phase;flash=1;$('message').textContent='TOUCH IMPULSE';if(ac&&playing)note(.6)});c.addEventListener('pointermove',e=>{if(drag){dx=e.clientX/W-.5;dy=e.clientY/H-.4;p.phase=(p.phase+.07)%6.283;$('phase').value=p.phase;flash=.8}});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);function frame(ms){requestAnimationFrame(frame);let dt=Math.min(.05,(ms-last)/1000||.016);last=ms;frames++;secs+=dt;if(secs>.6){fps=Math.round(frames/secs);frames=0;secs=0}if(motion)t+=dt*(.2+p.feed*.3);flash*=Math.exp(-dt*2.5);if(an&&playing){let d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);let s=0;for(let z of d)s+=z;level+=(s/d.length/255-level)*.1}else level*=.9;g.fillStyle='rgba(2,6,17,.17)';g.fillRect(0,0,W,H);g.save();g.globalCompositeOperation='lighter';let cx=W*.5,cy=H*.4,R=Math.min(W*.46,H*.3)*p.spread,count=fps&&fps<25?260:540;for(let layer=0;layer<3;layer++){g.beginPath();for(let i=0;i<=count;i++){let z=i/count*Math.PI*2,scale=1-layer*.14,x=cx+Math.sin(p.x*z+p.phase+t*.1+layer*.16+dx*.3)*R*scale,y=cy+Math.sin(p.y*z+layer*.16+dy*.3)*R*scale;if(!i)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle=['rgba(82,240,244,.63)','rgba(188,110,247,.27)','rgba(255,145,191,.2)'][layer];g.lineWidth=1.1+flash;g.stroke()}let z=t*2,x=cx+Math.sin(p.x*z+p.phase)*R,y=cy+Math.sin(p.y*z)*R,r=20+flash*26+level*45;let grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,'rgba(220,255,255,.9)');grad.addColorStop(1,'rgba(70,200,245,0)');g.fillStyle=grad;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.restore();$('status').textContent='FPS '+fps+' | AUDIO '+(ac?(playing?ac.state.toUpperCase():'MUTED'):'OFF')+'\nERROR '+error}requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(ac&&playing)master.gain.setTargetAtTime(document.hidden?0:.75,ac.currentTime,.05)})})();</script></body></html>
