<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>DOPPLER ATLAS 10</title><style>*{box-sizing:border-box}body{margin:0;background:#030a16;color:#e2ffff;font:12px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}h2{font-size:16px;letter-spacing:.12em;margin:0}#status{font:10px monospace;white-space:pre;text-align:right}section{position:fixed;bottom:8px;left:8px;right:8px;background:#061d2bf0;border:1px solid #37788a;border-radius:14px;padding:10px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button{height:42px;background:#15536a;color:white;border:1px solid #68a8b4;border-radius:8px;font-size:10px}#test{background:#168477}.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}label{font-size:10px;color:#afd1d7}label b{float:right}input{width:100%;height:22px;accent-color:#70e8d9}#msg{margin-top:8px;color:#b7e7c5;font:10px monospace;min-height:15px}#error{color:#ffaaa5}</style></head><body><canvas id="c"></canvas><header><div><h2>DOPPLER ATLAS 10</h2>DRAG THE BEACON • LISTEN AT CENTER</div><div id="status">FPS --\nAUDIO OFF\nERROR NONE</div></header><section><div class="buttons"><button id="test">♪ TEST NOTE</button><button id="sound">▶ SOUND</button><button id="orbit">ORBIT: ON</button><button id="reset">RESET</button></div><div class="sliders"><label>SPEED <b id="speedv"></b><input id="speed" type="range" min="0" max="100" value="50"></label><label>PITCH <b id="pitchv"></b><input id="pitch" type="range" min="100" max="650" value="220"></label><label>DOPPLER <b id="shiftv"></b><input id="shift" type="range" min="0" max="100" value="65"></label><label>TRAIL <b id="trailv"></b><input id="trail" type="range" min="10" max="100" value="72"></label><label>TIMBRE <b id="harmv"></b><input id="harm" type="range" min="0" max="100" value="40"></label><label>VOLUME <b id="volv"></b><input id="vol" type="range" min="0" max="100" value="55"></label></div><div id="msg">Tap TEST NOTE to unlock sound on iPhone.</div><div id="error" role="alert"></div></section><script>(()=>{'use strict';const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d');let w=0,h=0,t=0,last=performance.now(),fps=0,n=0,sample=last,drag=false,orbit=true,on=false,ac,o,o2,vol,filter,pan,err='NONE',waves=[],emit=0,p={x:.72,y:.35},old={x:.72,y:.35},notes=0;const v={speed:50,pitch:220,shift:65,trail:72,harm:40,vol:55};function message(s){$('msg').textContent=s}function fail(e){err=String(e?.message||e);$('error').textContent='ERROR '+err}addEventListener('error',e=>fail(e.error||e.message));addEventListener('unhandledrejection',e=>fail(e.reason));function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,1.5);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();for(const k of Object.keys(v)){$(k).oninput=e=>{v[k]=+e.target.value;$(k+'v').textContent=v[k];message(k+' = '+v[k])};$(k+'v').textContent=v[k]}function start(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();o=ac.createOscillator();o2=ac.createOscillator();vol=ac.createGain();filter=ac.createBiquadFilter();pan=ac.createStereoPanner?ac.createStereoPanner():ac.createGain();const sub=ac.createGain();sub.gain.value=.08;o.type='sine';o2.type='triangle';o.connect(filter);o2.connect(sub);sub.connect(filter);filter.connect(vol);vol.connect(pan);pan.connect(ac.destination);vol.gain.value=0;o.start();o2.start()}on=true;ac.resume().catch(fail);$('sound').textContent='■ MUTE';message('Sound active; move the source');return true}catch(e){fail(e);return false}}$('test').onclick=()=>{if(!start())return;const a=ac.currentTime;o.frequency.setTargetAtTime(v.pitch,a,.01);o2.frequency.setTargetAtTime(v.pitch*2,a,.01);vol.gain.cancelScheduledValues(a);vol.gain.setValueAtTime(Math.max(.0001,vol.gain.value),a);vol.gain.linearRampToValueAtTime(.19,a+.025);vol.gain.setTargetAtTime(.0001,a+.4,.16);notes++;message('TEST NOTE '+v.pitch+' Hz')};$('sound').onclick=()=>{if(on){on=false;vol.gain.setTargetAtTime(0,ac.currentTime,.03);$('sound').textContent='▶ SOUND';message('Muted')}else start()};$('orbit').onclick=()=>{orbit=!orbit;$('orbit').textContent='ORBIT: '+(orbit?'ON':'OFF')};$('reset').onclick=()=>{p={x:.72,y:.35};waves=[];t=0;message('Reset')};function move(e){p.x=Math.max(.05,Math.min(.95,e.clientX/w));p.y=Math.max(.08,Math.min(.82,e.clientY/(h-120)))}c.onpointerdown=e=>{drag=true;orbit=false;$('orbit').textContent='ORBIT: OFF';move(e);c.setPointerCapture(e.pointerId);message('Dragging beacon')};c.onpointermove=e=>{if(drag)move(e)};c.onpointerup=c.onpointercancel=()=>drag=false;function draw(now){try{const dt=Math.min(.05,(now-last)/1000||.016);last=now;t+=dt;n++;if(n%18===0){fps=Math.round(18000/(now-sample));sample=now}if(orbit&&!drag){p.x=.5+.29*Math.cos(t*(.35+v.speed*.022));p.y=.35+.21*Math.sin(t*(.35+v.speed*.022)*1.37)}const X=p.x*w,Y=p.y*(h-120),lx=w*.5,ly=Math.max(95,Math.min(h*.43,h-260)),dx=lx-X,dy=ly-Y,d=Math.max(1,Math.hypot(dx,dy)),radial=((p.x-old.x)*w*dx+(p.y-old.y)*(h-120)*dy)/(Math.max(.012,dt)*d);old={...p};const dop=1/(1-Math.max(-.7,Math.min(.7,radial/850*v.shift/100)));if(ac&&on&&ac.state==='running'){let a=ac.currentTime;o.frequency.setTargetAtTime(Math.max(70,Math.min(1600,v.pitch*dop)),a,.035);o2.frequency.setTargetAtTime(Math.max(140,Math.min(3200,v.pitch*dop*2)),a,.035);filter.frequency.setTargetAtTime(700+v.harm*45,a,.04);vol.gain.setTargetAtTime(.025+v.vol*.00115,a,.05);if(pan.pan)pan.pan.setTargetAtTime(Math.max(-.8,Math.min(.8,(X-lx)/w*1.5)),a,.05)}g.fillStyle='#030a16';g.fillRect(0,0,w,h);let bg=g.createRadialGradient(lx,ly,1,lx,ly,Math.max(w,h)*.7);bg.addColorStop(0,'#10374c');bg.addColorStop(1,'#030a16');g.fillStyle=bg;g.fillRect(0,0,w,h);if(t-emit>.085){waves.push({x:X,y:Y,t});emit=t}while(waves.length>Math.min(100,18+v.trail))waves.shift();for(let a of waves){let age=t-a.t,alpha=Math.max(0,1-age/(1+v.trail/35));g.strokeStyle='rgba(86,217,237,'+(alpha*.5)+')';g.lineWidth=1+alpha;g.beginPath();g.arc(a.x,a.y,age*120,0,Math.PI*2);g.stroke()}g.strokeStyle='#467e90';g.setLineDash([4,6]);g.beginPath();g.moveTo(X,Y);g.lineTo(lx,ly);g.stroke();g.setLineDash([]);g.fillStyle='#80eaff';g.shadowColor='#23e3ff';g.shadowBlur=22;g.beginPath();g.arc(X,Y,10,0,7);g.fill();g.shadowBlur=0;g.strokeStyle='#ffd8a0';g.lineWidth=2;g.beginPath();g.arc(lx,ly,15,0,7);g.stroke();g.fillStyle='#c3f3ff';g.font='11px monospace';g.fillText('SOURCE',X+14,Y-12);g.fillText('LISTENER',lx+19,ly-10);g.fillText('RECEIVED '+Math.round(v.pitch*dop)+' Hz',12,Math.max(100,h*.17));$('status').textContent='FPS '+fps+'\nAUDIO '+(ac?ac.state:'off')+(on?'/ON':'/MUTED')+'\nERROR '+err;requestAnimationFrame(draw)}catch(e){fail(e);requestAnimationFrame(draw)}}requestAnimationFrame(draw);window.__INSTRUMENT_TEST__=()=>({fps,audio:ac?.state||'off',on,err,notes,waves:waves.length,p,v})})();</script></body></html>
