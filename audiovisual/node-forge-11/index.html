<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NODE FORGE 11</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#040b16;color:#e8f9ff;font:13px system-ui;height:100%;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}header{position:absolute;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;padding-top:10px}h1{font-size:16px;letter-spacing:.16em;margin:0}small{color:#a3c7d2}#status{font:10px/1.5 monospace;text-align:right;color:#b1edcc;background:#03111a99;padding:5px;border-radius:5px}#panel{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;max-width:720px;margin:auto;border:1px solid #537d91;border-radius:14px;background:#071522ee;padding:10px}#buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button{background:#14495b;color:white;border:1px solid #4a9eb1;border-radius:7px;min-height:43px;font-size:11px;font-weight:600;touch-action:manipulation}button:active{background:#237e90}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:10px}label{font-size:10px;color:#a8cbd6;min-width:0}label b{float:right;color:white;font-weight:400}input{width:100%;accent-color:#65e5d8;height:24px;touch-action:pan-x}#msg{margin-top:5px;font:10px monospace;color:#a6dfd8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#error{color:#ffb3ad;white-space:normal;max-height:50px;overflow:auto}a{color:#9fe9f7}@media(max-width:420px){button{font-size:9px}#panel{padding:8px}#controls{gap:4px 7px}}
</style><canvas id="view"></canvas><header><div><h1>NODE FORGE <span style="color:#69e9d7">11</span></h1><small>PLAY THE STILLNESS OF A VIBRATING PLATE</small></div><div id="status">FPS --<br>AUDIO OFF<br>ERROR NONE</div></header><section id="panel"><div id="buttons"><button id="test">♪ TEST NOTE</button><button id="sound">START SOUND</button><button id="pattern">MODE 2:3</button><button id="scatter">RESEED SAND</button></div><div id="controls"><label>MODE X <b id="xv">2</b><input id="mx" type="range" min="1" max="9" value="2"></label><label>MODE Y <b id="yv">3</b><input id="my" type="range" min="1" max="9" value="3"></label><label>BLEND <b id="bv">35</b><input id="blend" type="range" min="0" max="100" value="35"></label><label>DRIVE <b id="dv">55</b><input id="drive" type="range" min="0" max="100" value="55"></label><label>GRAIN SPEED <b id="sv">55</b><input id="speed" type="range" min="0" max="100" value="55"></label><label>VOLUME <b id="vv">45</b><input id="volume" type="range" min="0" max="100" value="45"></label></div><div id="msg">Tap TEST NOTE to unlock audio. Drag the plate to excite it.</div><div id="error"></div></section><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d',{alpha:false});let w=0,h=0,dpr=1,cx=0,cy=0,side=0,frame=0,fps=0,elapsed=0,frames=0,last=performance.now(),mode=0,phase=0,pulse=0,active=false,ac=null,master=null,voices=[],audioState='OFF',error='NONE';let particles=[];const val=id=>+$ (id).value;const message=s=>$('msg').textContent=s;function fail(e){error=String(e?.message||e).slice(0,170);$('error').textContent='ERROR: '+error;message('Something failed. Error displayed below.');}window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);side=Math.min(w-32,h-Math.min(280,h*.38)-85,530);side=Math.max(100,side);cx=w/2;cy=(h-Math.min(250,h*.32))/2+8;}addEventListener('resize',resize);resize();function seed(){particles=Array.from({length:Math.min(1100,Math.round(side*1.8))},()=>({x:Math.random()*2-1,y:Math.random()*2-1}));message('Sand scattered. Watch it migrate toward still lines.');}seed();function field(x,y){let a=val('mx'),b=val('my'),q=val('blend')/100;return (1-q)*Math.cos(a*Math.PI*x)*Math.cos(b*Math.PI*y)+q*Math.cos(b*Math.PI*x)*Math.cos(a*Math.PI*y);}function strike(x=0,y=0){pulse=1;phase+=.4;message('Plate struck at '+x.toFixed(2)+', '+y.toFixed(2));if(ac&&ac.state==='running')tone(170+val('mx')*35+val('my')*20,.65,x*.65);else message('Plate struck visually. Tap TEST NOTE to enable sound.');}function tone(freq,dur=.55,pan=0){if(!ac||ac.state!=='running')return;const now=ac.currentTime;let o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner?ac.createStereoPanner():null;o.type='sine';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*.72,now+Math.min(.18,dur));const amp=.19*(val('volume')/100);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,amp),now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);if(p){p.pan.value=Math.max(-1,Math.min(1,pan));g.connect(p);p.connect(master)}else g.connect(master);o.start(now);o.stop(now+dur+.04);o.onended=()=>{o.disconnect();g.disconnect();p?.disconnect()};}async function unlock(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Web Audio unavailable');ac=new C();master=ac.createGain();master.gain.value=.72;master.connect(ac.destination);}await ac.resume();audioState=ac.state.toUpperCase();$('sound').textContent=ac.state==='running'?'SOUND ON':'RETRY SOUND';if(ac.state!=='running')throw Error('Audio context '+ac.state);return true}catch(e){audioState='BLOCKED';fail(e);return false}}$('test').addEventListener('click',async()=>{if(await unlock()){tone(440,.8,0);setTimeout(()=>{if(ac?.state==='running')tone(660,.4,.3)},160);pulse=1;message('TEST NOTE: 440 Hz then 660 Hz. Audio '+ac.state);}});$('sound').addEventListener('click',async()=>{if(await unlock()){tone(330,.3);message('Sound enabled. Tap or drag the plate.')}});$('pattern').addEventListener('click',()=>{mode=(mode+1)%5;const arr=[[2,3],[3,5],[4,6],[1,7],[5,8]];$('mx').value=arr[mode][0];$('my').value=arr[mode][1];update();strike();});$('scatter').addEventListener('click',()=>{seed();strike();});function update(){for(let [id,out] of [['mx','xv'],['my','yv'],['blend','bv'],['drive','dv'],['speed','sv'],['volume','vv']])$(out).textContent=$(id).value;$('pattern').textContent='MODE '+val('mx')+':'+val('my');pulse=.8;message('Parameters changed: plate nodal geometry updated.');}for(let id of ['mx','my','blend','drive','speed','volume'])$(id).addEventListener('input',()=>{update();if(ac?.state==='running'&&id!=='volume')tone(130+val('mx')*35+val('my')*15,.16)});let down=false;function point(e){let x=(e.clientX-(cx-side/2))/(side)*2-1,y=(e.clientY-(cy-side/2))/(side)*2-1;if(Math.abs(x)>1.15||Math.abs(y)>1.15)return;strike(x,y);for(let i=0;i<particles.length;i+=3){particles[i].x=Math.max(-1,Math.min(1,x+(Math.random()-.5)*.32));particles[i].y=Math.max(-1,Math.min(1,y+(Math.random()-.5)*.32));}}canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);point(e)});canvas.addEventListener('pointermove',e=>{if(down&&frame%3===0)point(e)});canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);function render(now){try{const dt=Math.min(.05,(now-last)/1000||.016);last=now;elapsed+=dt;frames++;if(elapsed>.65){fps=Math.round(frames/elapsed);elapsed=0;frames=0;}frame++;phase+=dt*(1.8+val('drive')*.06);pulse*=.972;ctx.fillStyle='#040b16';ctx.fillRect(0,0,w,h);const x0=cx-side/2,y0=cy-side/2;ctx.fillStyle='#081b2a';ctx.fillRect(x0,y0,side,side);ctx.strokeStyle='#56859b';ctx.lineWidth=1;ctx.strokeRect(x0,y0,side,side);const cells=46,step=side/cells;for(let j=0;j<cells;j++){for(let i=0;i<cells;i++){let x=(i+.5)/cells*2-1,y=(j+.5)/cells*2-1,v=field(x,y),a=Math.abs(v),node=Math.exp(-a*a*170),sway=.5+.5*Math.sin(phase)*v;ctx.fillStyle='rgba('+Math.round(22+node*40)+','+Math.round(50+node*165+sway*20)+','+Math.round(80+node*120)+','+(0.1+node*.58+pulse*.12)+')';ctx.fillRect(x0+i*step,y0+j*step,step+1,step+1);}}const move=(val('speed')/100)*.014*(.2+val('drive')/70);ctx.fillStyle='#e7f8e8';for(const p of particles){let x=p.x,y=p.y,eps=.009,f=field(x,y),gx=(field(Math.min(1,x+eps),y)-field(Math.max(-1,x-eps),y))/(2*eps),gy=(field(x,Math.min(1,y+eps))-field(x,Math.max(-1,y-eps)))/(2*eps);p.x=Math.max(-.995,Math.min(.995,x-move*2*f*gx+(Math.random()-.5)*move*.1));p.y=Math.max(-.995,Math.min(.995,y-move*2*f*gy+(Math.random()-.5)*move*.1));ctx.fillRect(x0+(p.x+1)*side/2,y0+(p.y+1)*side/2,1.5,1.5);}ctx.fillStyle='#9ec4cf';ctx.font='11px monospace';ctx.fillText('NODAL SAND / IDEALIZED MODE SUPERPOSITION',x0+6,y0-9);$('status').innerHTML='FPS '+fps+'<br>AUDIO '+audioState+'<br>ERROR '+(error==='NONE'?'NONE':'SEE BELOW');}catch(e){fail(e)}requestAnimationFrame(render)}requestAnimationFrame(render);
})();
</script></html>
