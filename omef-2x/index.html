<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050608"><meta name="apple-mobile-web-app-capable" content="yes"><title>OMEF · Studio 04</title><style>

</style></head><body><div id="app"><div id="stageWrap">
<canvas id="stage" aria-label="Numerically integrated rainbow filament sculpture"></canvas>
<div class="topbar"><div class="identity">OMEF <span>EXPRESSION / 04</span></div><button class="iconbtn" id="runBtn">Play</button><button class="iconbtn" id="refBtn">Set ref</button><button class="iconbtn" id="exploreBtn">Explore</button><button class="iconbtn" id="expandBtn">Expand</button></div>
<div id="status">INITIALIZING</div>
<div id="presetRow" class="presetRow"></div></div>
<div id="panel"><div class="panelTitle"><div><strong>Instrument controls</strong><small>Adjust the equations while viewing the sculpture</small></div><span id="modeText">STILL REFERENCE</span></div><nav class="tabs" id="tabs"></nav><div id="groups"><div id="mathReadout"></div></div></div>
<button id="randomBtn" style="position:absolute;left:-1000px;width:1px;height:1px" aria-hidden="true">Random</button>
<script>
(()=>{'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const stageWrap = document.getElementById('stageWrap');
const statusEl = document.getElementById('status');
const modeText = document.getElementById('modeText');
const mathEl = document.getElementById('mathReadout');
const groupsEl = document.getElementById('groups');
const presetRow = document.getElementById('presetRow');
const runBtn = document.getElementById('runBtn');
const refBtn = document.getElementById('refBtn');
const exploreBtn = document.getElementById('exploreBtn');
const randomBtn = document.getElementById('randomBtn');

const R=34, N=196;
const q = Array.from({length:R},()=>new Float32Array(N));
const v = Array.from({length:R},()=>new Float32Array(N));
const q2= Array.from({length:R},()=>new Float32Array(N));
const v2= Array.from({length:R},()=>new Float32Array(N));
const tmp=Array.from({length:R},()=>new Float32Array(N));
const tmp2=Array.from({length:R},()=>new Float32Array(N));
const phi = new Float32Array(R);
const phi2 = new Float32Array(R);
let anchorQ, anchorV, anchorPhi, anchorSteps=0, baselineQ, baselineV, baselinePhi;
let steps=0, running=false, exploring=false, previewDelta=0, lastVel=0, seed=20261120;
let dragState=null, W=300, H=300, DPR=1;
const TWO=Math.PI*2;
function rng(){seed ^= seed<<13; seed ^= seed>>>17; seed ^= seed<<5; return (seed>>>0)/4294967296;}
function clip(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function mod(i,m){i%=m; return i<0?i+m:i}

const spec = [
  {group:'Dynamics', items:[
    ['speed','Speed',0.2,3.5,1.2,0.01,'Multiplier for solver steps per frame'],
    ['damping','Damping',0.000,0.12,0.022,0.001,'Global dissipation'],
    ['pump','Energy pump',0,0.22,0.08,0.001,'Active feedback that replenishes motion'],
    ['pumpTarget','Pump target',0.02,0.95,0.36,0.01,'Target RMS velocity for pump regulation'],
    ['drive','Time drive',0,1.6,0.55,0.01,'Temporal forcing amplitude'],
    ['driveFreq','Drive frequency',0,4.0,1.18,0.01,'Time frequency of external drive'],
    ['beat','Beat mismatch',0,3.5,1.35,0.01,'Secondary forcing frequency mismatch'],
    ['feedback','Local feedback',0,1.6,0.48,0.01,'Field dependent temporal forcing'],
    ['tempo','Clock scale',0.2,2.4,1.0,0.01,'Global temporal rate']
  ]},
  {group:'Spatial operators', items:[
    ['tension','Tension',0,3.5,1.22,0.01,'Second derivative along each ribbon'],
    ['biharm','Biharmonic',0,0.18,0.038,0.001,'Fourth derivative smoothing or sharpening'],
    ['advection','Advection',-0.55,0.55,0.10,0.001,'First derivative drift along x'],
    ['dispersion','Dispersion',-0.42,0.42,0.066,0.001,'Third derivative dispersive twist'],
    ['mixX','Mixed derivative',-0.22,0.22,0.042,0.001,'x-derivative modulated by neighboring ribbons'],
    ['shear','Ribbon shear',-0.30,0.30,0.07,0.001,'Cross-ribbon phase skew'],
    ['neighbor','Neighbor coupling',0,2.2,0.94,0.01,'Second difference across ribbons'],
    ['longCouple','Long coupling',0,1.4,0.42,0.01,'Two-ribbon distance coupling'],
    ['anisotropy','Anisotropy',-1.2,1.2,0.18,0.01,'Biases left/right and top/bottom propagation']
  ]},
  {group:'Nonlinearity', items:[
    ['cubic','Cubic force',0,2.6,0.78,0.01,'Odd nonlinear restoring force'],
    ['quintic','Quintic force',0,0.80,0.11,0.005,'Higher-order envelope control'],
    ['exp','Exponent',1.2,5.4,2.7,0.01,'Power in the odd nonlinearity'],
    ['saturate','Saturation',0,1.5,0.33,0.01,'Damps the nonlinear growth at large amplitude'],
    ['curvatureDrive','Curvature drive',0,1.6,0.42,0.01,'Inject energy from local curvature'],
    ['velDiff','Velocity diffusion',0,1.4,0.24,0.01,'Cross-ribbon smoothing of velocity'],
    ['phaseLock','Phase lock',0,1.7,0.45,0.01,'Tends neighboring ribbon oscillators toward coherence'],
    ['phaseSlip','Phase slip',0,1.2,0.25,0.01,'Breaks synchronization for richer regimes']
  ]},
  {group:'Heterogeneity', items:[
    ['heteroAmp','Heterogeneity',0,2.6,0.90,0.01,'Spatially varying stiffness field'],
    ['heteroFreq','Hetero frequency',0.1,6.0,2.1,0.01,'Frequency of the static modulation field'],
    ['crossMod','Cross modulation',0,1.7,0.52,0.01,'Lets neighboring ribbons modulate each other'],
    ['resonance','Resonance',0,1.8,0.44,0.01,'Strength of narrow-band resonant response'],
    ['fold','Fold bias',-1.3,1.3,0.05,0.01,'Tilts upper versus lower layers'],
    ['symmetry','Symmetry break',-1.4,1.4,0.16,0.01,'Biases even and odd ribbons differently'],
    ['macro','Macro warp',0,1.9,0.55,0.01,'Slow large-scale bending field']
  ]},
  {group:'Geometry', items:[
    ['previewSteps','Preview horizon',8,160,34,1,'Solver horizon used in still mode'],
    ['amplitude','Vertical amplitude',0.25,3.4,1.40,0.01,'Maps field values to screen height'],
    ['ribbonGap','Ribbon gap',0.45,2.4,1.05,0.01,'Distance between layered filaments'],
    ['xSpread','X spread',0.55,2.3,1.00,0.01,'Horizontal scaling'],
    ['yCompress','Y compression',0.3,2.3,1.00,0.01,'Vertical compression'],
    ['perspective','Perspective',0.1,2.5,1.05,0.01,'Depth magnification'],
    ['tilt','Tilt',-1.1,1.1,0.72,0.01,'Camera tilt'],
    ['yaw','Yaw',-2.4,2.4,-0.20,0.01,'Camera rotation'],
    ['roll','Roll',-1.2,1.2,0.02,0.01,'Camera roll'],
    ['zoom','Zoom',0.55,1.75,1.08,0.01,'View scaling']
  ]},
  {group:'Rendering', items:[
    ['density','Line density',0.25,2.0,1.25,0.01,'How many filaments are drawn'],
    ['thickness','Thickness',0.2,2.6,0.85,0.01,'Stroke thickness'],
    ['glow','Glow',0,1.7,0.54,0.01,'Outer luminous halo'],
    ['alpha','Alpha',0.05,0.95,0.48,0.01,'Line transparency'],
    ['hueSpin','Hue spin',0,2.2,0.92,0.01,'How quickly color cycles'],
    ['depthHue','Depth hue',0,1.5,0.55,0.01,'Hue changes with depth'],
    ['curvHue','Curvature hue',0,2.2,1.08,0.01,'Hue changes with curvature'],
    ['contrast','Contrast',0.2,2.0,1.08,0.01,'Depth/brightness contrast'],
    ['trail','Trails',0,1.0,0.0,0.01,'Frame persistence while running']
  ]}
];
const P = Object.fromEntries(spec.flatMap(g=>g.items.map(i=>[i[0],i[4]])));
const inputs = {};
const presets = {
  'Serene': {damping:.028,pump:.03,drive:.24,tension:.8,biharm:.022,neighbor:.6,cubic:.42,quintic:.06,fold:.0,amplitude:1.05,density:0.8,glow:0.6,alpha:0.22,curvHue:0.55,phaseSlip:.10},
  'Storm': {damping:.018,pump:.14,drive:.86,driveFreq:1.64,beat:2.28,feedback:.82,tension:1.46,biharm:.051,dispersion:.12,neighbor:1.25,cubic:.98,quintic:.13,curvatureDrive:.74,phaseSlip:.48,macro:.95,amplitude:1.65,density:1.35,glow:1.1,alpha:.25},
  'Lattice': {damping:.026,pump:.06,drive:.35,feedback:.22,tension:1.25,biharm:.012,neighbor:1.52,longCouple:.76,phaseLock:1.05,phaseSlip:.05,heteroAmp:.55,symmetry:0,fold:0,amplitude:1.15,density:1.05},
  'Folded': {damping:.024,pump:.09,drive:.56,feedback:.4,tension:.95,biharm:.065,dispersion:.08,mixX:.09,shear:.12,cubic:.72,quintic:.18,fold:.72,symmetry:.34,macro:1.2,amplitude:1.8,ribbonGap:1.2,glow:1.0},
  'Prismatic': {damping:.02,pump:.10,drive:.62,driveFreq:1.0,beat:1.4,tension:1.0,neighbor:.88,cubic:.7,quintic:.12,phaseLock:.38,phaseSlip:.34,amplitude:1.45,hueSpin:1.45,depthHue:.88,curvHue:1.55,glow:1.25,density:1.4}
};

function resize(){
  const r = stageWrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.max(50,r.width); H = Math.max(50,r.height);
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(anchorQ && baselineQ) draw();
}
window.addEventListener('resize', resize);
if(typeof ResizeObserver!=="undefined") new ResizeObserver(resize).observe(stageWrap);

function clearState(){
  for(let r=0;r<R;r++){
    q[r].fill(0); v[r].fill(0); q2[r].fill(0); v2[r].fill(0);
    phi[r]=0; phi2[r]=0;
  }
}
function initialize(seedJolt=0){
  clearState(); steps=0;
  for(let r=0;r<R;r++){
    const basePhase = TWO*r/R;
    phi[r] = basePhase*.45 + (rng()-.5)*0.08;
    for(let i=0;i<N;i++){
      const x = i/N*TWO;
      const field = 0.32*Math.sin(1.7*x + basePhase) + 0.18*Math.sin(3.3*x - basePhase*1.2) + 0.08*Math.cos(6.8*x + r*0.17);
      q[r][i] = field + seedJolt*(rng()-.5)*0.12;
      v[r][i] = 0.05*Math.sin(2.2*x + r*0.2) + seedJolt*(rng()-.5)*0.02;
    }
  }
  captureAnchor();
  computeBaseline();
}
function clone2D(arr){ return arr.map(a=>new Float32Array(a)); }
function captureAnchor(){
  anchorQ = clone2D(q); anchorV = clone2D(v); anchorPhi = new Float32Array(phi); anchorSteps = steps;
}
function restoreAnchor(){
  for(let r=0;r<R;r++){ q[r].set(anchorQ[r]); v[r].set(anchorV[r]); phi[r]=anchorPhi[r]; }
  steps = anchorSteps;
}
function computeBaseline(){
  restoreAnchor();
  const horizon = Math.max(1, Math.round(P.previewSteps));
  for(let k=0;k<horizon;k++) step(0.032);
  baselineQ = clone2D(q); baselineV = clone2D(v); baselinePhi = new Float32Array(phi);
  restoreAnchor(); previewDelta = 0;
}
function fieldAt(arr,r,i){ return arr[mod(r,R)][mod(i,N)] }
function hetero(r,i){
  const x=i/N*TWO, y=r/R*TWO;
  return P.heteroAmp*(0.45*Math.sin(P.heteroFreq*x + .7*Math.cos(y)) + 0.3*Math.cos((P.heteroFreq*0.6+1.0)*y - 0.8*Math.sin(x)));
}
function step(dt){
  const dt2 = dt*P.tempo;
  let velSum=0;
  // phase evolution per ribbon
  for(let r=0;r<R;r++){
    const ph=phi[r], phL=phi[mod(r-1,R)], phR=phi[mod(r+1,R)], qMid=q[r][(steps+r*13)%N];
    const dph = 0.18 + P.phaseLock*(Math.sin(phL-ph)+Math.sin(phR-ph)) - P.phaseSlip*Math.sin(2.7*ph + 0.4*r) + 0.12*P.feedback*qMid;
    phi2[r] = ph + dt2*dph;
  }
  for(let r=0;r<R;r++){
    const rr = q[r], vv = v[r], nr = q2[r], nv = v2[r];
    const qU = q[mod(r-1,R)], qD = q[mod(r+1,R)], qUU = q[mod(r-2,R)], qDD = q[mod(r+2,R)];
    const vU = v[mod(r-1,R)], vD = v[mod(r+1,R)];
    const basePhase = phi[r], clock = steps*dt2;
    for(let i=0;i<N;i++){
      const qm2=rr[mod(i-2,N)], qm1=rr[mod(i-1,N)], q0=rr[i], qp1=rr[mod(i+1,N)], qp2=rr[mod(i+2,N)];
      const lap = qp1 - 2*q0 + qm1;
      const bih = qm2 - 4*qm1 + 6*q0 - 4*qp1 + qp2;
      const d1 = 0.5*(qp1 - qm1);
      const d3 = 0.5*(qp2 - 2*qp1 + 2*qm1 - qm2);
      const across = qD[i] - 2*q0 + qU[i];
      const longAcross = qDD[i] - 2*q0 + qUU[i];
      const mix = 0.25*((qD[mod(i+1,N)]-qD[mod(i-1,N)]) - (qU[mod(i+1,N)]-qU[mod(i-1,N)]));
      const velAcross = vD[i] - 2*vv[i] + vU[i];
      const amp = Math.abs(q0);
      const sign = q0===0?0:Math.sign(q0);
      const non = -P.cubic*sign*Math.pow(amp,P.exp)/(1 + P.saturate*amp*amp);
      const quint = -P.quintic*q0*q0*q0*q0*q0;
      const het = hetero(r,i);
      const symBias = P.symmetry*((r&1)?1:-1)*0.08;
      const x = i/N*TWO; const y = r/R*TWO;
      const drive = P.drive*(Math.sin(P.driveFreq*clock + x*(1+0.35*P.anisotropy) + basePhase) + 0.65*Math.sin((P.driveFreq+P.beat)*clock - 1.4*x + .8*y));
      const macro = P.macro*(0.55*Math.sin(0.21*clock + 0.8*x + 2.0*y) + 0.4*Math.cos(0.13*clock - 1.2*x + 0.5*y));
      const curvature = P.curvatureDrive*lap*Math.tanh(0.8+Math.abs(q0));
      const reson = P.resonance*Math.sin(2.3*clock + 5*x + y)*Math.exp(-3*Math.abs(q0));
      const feedbackDrive = P.feedback*(0.45*Math.tanh(q0) + 0.25*Math.tanh(across));
      const accel =
        P.tension*lap - P.biharm*bih + P.advection*d1 + P.dispersion*d3 + P.mixX*mix + P.neighbor*across + P.longCouple*longAcross + P.shear*(qD[mod(i+1,N)]-qU[mod(i+1,N)] - qD[mod(i-1,N)] + qU[mod(i-1,N)])*0.25
        + non + quint + curvature + drive + reson + feedbackDrive + macro + het + symBias + P.crossMod*(qU[i]*qD[i]-q0*q0)*0.08 + P.fold*(r/(R-1)-0.5);
      const vel = vv[i];
      const localPump = P.pump*(P.pumpTarget*P.pumpTarget - vel*vel)*vel;
      const damp = P.damping*vel;
      nr[i] = q0 + dt2*vel;
      nv[i] = clip(vel + dt2*(accel - damp + localPump + P.velDiff*velAcross), -3.2, 3.2);
      velSum += nv[i]*nv[i];
    }
  }
  for(let r=0;r<R;r++){
    q[r].set(q2[r]); v[r].set(v2[r]); phi[r]=phi2[r];
  }
  lastVel = Math.sqrt(velSum/(R*N));
  steps++;
}
function calcDelta(){
  let s=0;
  for(let r=0;r<R;r++){
    const a=q[r], b=baselineQ[r];
    for(let i=0;i<N;i++){
      const d=a[i]-b[i]; s += d*d;
    }
  }
  previewDelta = Math.sqrt(s/(R*N));
}
function recomputeStill(){
  if(running) return;
  restoreAnchor();
  const horizon = Math.max(1, Math.round(P.previewSteps));
  for(let k=0;k<horizon;k++) step(0.032);
  calcDelta();
  draw();
}

function renderBg(){
  if(P.trail>0 && running){
    ctx.fillStyle=`rgba(0,0,0,${clip(1-P.trail*0.18,0.04,0.25)})`;
    ctx.fillRect(0,0,W,H);
  }else{
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  }
}
function project(x,y,z){
  const cy=Math.cos(P.yaw), sy=Math.sin(P.yaw);
  let X=cy*x+sy*z, Z=-sy*x+cy*z, Y=y;
  const ct=Math.cos(P.tilt), st=Math.sin(P.tilt);
  let Y2=ct*Y-st*Z, Z2=st*Y+ct*Z, X2=X;
  const cr=Math.cos(P.roll), sr=Math.sin(P.roll);
  let X3=cr*X2-sr*Y2, Y3=sr*X2+cr*Y2;
  let perspective=P.zoom*3.4/(3.4+P.perspective*(Z2+0.3));
  perspective=clip(perspective,.36,2.2);
  return [W*.50+X3*perspective*W*.46,H*.52-Y3*perspective*H*.42,Z2];
}
function renderBg(){
  ctx.fillStyle='#000000'; ctx.fillRect(0,0,W,H);
}
function draw(){
  if(W<5||H<5)return;
  renderBg();
  const count= Math.round(55 + P.density*62);
  const bands=[];
  for(let layer=0;layer<count;layer++){
    const rpos=(layer/(count-1))*(R-1);
    const a=Math.floor(rpos), b=Math.min(R-1,a+1),t=rpos-a;
    const rn=(layer/(count-1)-.5)*2;
    const phase=lerp(phi[a],phi[b],t);
    const pts=[];
    for(let i=0;i<N;i+=3){
      const x=(i/(N-1)-.5)*2.28*P.xSpread;
      const field=lerp(q[a][i],q[b][i],t);
      const yy=field*P.amplitude*P.yCompress;
      const zz=rn*P.ribbonGap+P.fold*rn*.07;
      const point=project(x,yy,zz);
      pts.push(point);
    }
    bands.push({layer,pts,depth:rn});
  }
  ctx.lineCap='round';ctx.lineJoin='round';
  // Every path samples the coupled field; extra filaments are interpolated observations,
  // not independent shape generators or a second animation engine.
  for(const band of bands){
    const l=band.layer;
    const gr=ctx.createLinearGradient(band.pts[0][0],0,band.pts[band.pts.length-1][0],0);
    const ir=(l/(count-1))*(R-1),r=Math.min(R-1,Math.floor(ir));
    for(let k=0;k<=10;k++){
      const t=k/10;
      const i=Math.min(N-1,Math.floor(t*(N-1)));
      const qi=q[r][i];
      const curve=q[r][mod(i+1,N)]-2*qi+q[r][mod(i-1,N)];
      const hue=(( 350*(t*P.hueSpin+P.depthHue*l/count)+55*P.curvHue*curve + l*1.4 )%360+360)%360;
      const li=clip(53 + 16*Math.sin(TWO*t*1.55+l*.12)*P.contrast,35,76);
      gr.addColorStop(t,`hsl(${hue.toFixed(0)} 100% ${li.toFixed(1)}%)`);
    }
    if(P.glow>0.05){
      ctx.strokeStyle=gr;ctx.globalAlpha=clip(.12*P.alpha*P.glow,.01,.17);
      ctx.lineWidth=2.5+P.thickness*2.4+P.glow*3.2;
      ctx.shadowBlur=6*P.glow;ctx.shadowColor='rgba(160,150,255,.55)';
      strokePoints(band.pts); ctx.shadowBlur=0;
    }
    ctx.strokeStyle=gr;ctx.globalAlpha=clip(P.alpha*.75+.10,.12,.95);
    ctx.lineWidth=.30+P.thickness*.64;
    strokePoints(band.pts);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';
}
function strokePoints(pts){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let k=1;k<pts.length;k++) ctx.lineTo(pts[k][0],pts[k][1]);
  ctx.stroke();
}
function updateEquation(){
  mathEl.textContent=`q̈ = ${P.tension.toFixed(2)}·Δₓq − ${P.biharm.toFixed(3)}·Δₓ⁴q + ${P.neighbor.toFixed(2)}·Δᵣq + ${P.mixX.toFixed(3)}·∂ₓΔᵣq
− ${P.cubic.toFixed(2)}·sgn(q)|q|^${P.exp.toFixed(2)}/(1+${P.saturate.toFixed(2)}q²) − ${P.quintic.toFixed(2)}q⁵
+ driving(t,x,r) + coupling(q,Δᵣq) + feedback(q) − ${P.damping.toFixed(3)}·q̇
+ ${P.pump.toFixed(3)}·(${P.pumpTarget.toFixed(2)}²−q̇²)q̇ + remaining operators`;
}
function updateUI(force=false){
  statusEl.textContent=`${running?'MOVING':'STILL'}  ·  Δ ${previewDelta.toFixed(4)}  ·  v ${lastVel.toFixed(3)}`;
  modeText.textContent=running?'LIVE DYNAMICS':'STILL REFERENCE';
  runBtn.classList.toggle('active',running);
  runBtn.textContent=running?'Pause':'Play';
  exploreBtn.classList.toggle('active',exploring);
  if(force)updateEquation();
}
let frames=0;
function animate(){
  if(exploring){
    autoMorph();
    if(!running && frames%4===0)recomputeStill();
  }
  if(running){
    const count=Math.max(1,Math.round(P.speed*1.6));
    for(let i=0;i<count;i++)step(.032);
    if(!Number.isFinite(lastVel)||lastVel>30){running=false;statusEl.textContent='SOLVER ERROR';}
    else draw();
    previewDelta=0;
  }
  if(++frames%8===0)updateUI();
  requestAnimationFrame(animate);
}

let autoTargets={};
function reseedTargets(){
  const keys = ['tension','biharm','neighbor','cubic','exp','drive','driveFreq','beat','feedback','heteroAmp','macro','phaseLock','phaseSlip','fold','amplitude','density','glow','depthHue','curvHue'];
  for(const k of keys){
    const item = spec.flatMap(g=>g.items).find(i=>i[0]===k); if(!item) continue;
    autoTargets[k] = item[1] ? null : null;
  }
  for(const group of spec) for(const item of group.items){
    const [k,,min,max] = item;
    if(k in autoTargets) autoTargets[k] = min + rng()*(max-min);
  }
}
function autoMorph(){
  if(!Object.keys(autoTargets).length) reseedTargets();
  let settled = 0, total = 0;
  for(const [k,target] of Object.entries(autoTargets)){
    total++;
    P[k] = lerp(P[k], target, 0.006);
    if(Math.abs(P[k]-target)<0.015) settled++;
    if(inputs[k]){ inputs[k].value = P[k]; inputs[k].parentElement.querySelector('.val').textContent = formatVal(P[k]); }
  }
  if(settled > total*0.85) reseedTargets();
}
function formatVal(v){ return Math.abs(v)>=100 ? v.toFixed(0) : Math.abs(v)>=10 ? v.toFixed(1) : v.toFixed(3).replace(/0+$/,'').replace(/\.$/,''); }
let activeGroup='Dynamics';
function activateGroup(name){
  activeGroup=name;
  document.querySelectorAll('.tabPage').forEach(el=>el.classList.toggle('selected',el.dataset.name===name));
  document.querySelectorAll('.tabBtn').forEach(el=>el.classList.toggle('selected',el.dataset.group===name));
  groupsEl.scrollTop=0;
}
function addControls(){
  const tabBar=document.getElementById('tabs');
  for(const group of spec){
    const btn=document.createElement('button');btn.className='tabBtn';
    btn.textContent=group.group;btn.dataset.group=group.group;
    btn.onclick=()=>activateGroup(group.group);tabBar.appendChild(btn);
    const section=document.createElement('section');section.className='tabPage';section.dataset.name=group.group;
    section.innerHTML=`<div class="sectionLabel">${group.group} <span>${group.items.length} parameters</span></div><div class="grid"></div>`;
    const grid=section.querySelector('.grid');
    for(const item of group.items){
      const [key,label,min,max,def,step,desc]=item;
      const card=document.createElement('label');card.className='control';
      card.innerHTML=`<header><span class="name">${label}</span><output class="val">${formatVal(def)}</output></header><input type="range" min="${min}" max="${max}" step="${step}" value="${def}" aria-label="${label}"><small>${desc}</small>`;
      const input=card.querySelector('input');inputs[key]=input;
      input.addEventListener('input',()=>{
        P[key]=Number(input.value);card.querySelector('.val').textContent=formatVal(P[key]);
        updateEquation();
        if(!running){
          if(['amplitude','ribbonGap','xSpread','yCompress','perspective','tilt','yaw','roll','zoom','density','thickness','glow','alpha','hueSpin','depthHue','curvHue','contrast','trail'].includes(key))draw();
          else requestStill();
        }
      });
      grid.appendChild(card);
    }
    groupsEl.appendChild(section);
  }
  const eq=document.createElement('button');eq.className='tabBtn';eq.textContent='Equation';eq.dataset.group='Equation';
  eq.onclick=()=>activateGroup('Equation');tabBar.appendChild(eq);
  const page=document.createElement('section');page.className='tabPage';page.dataset.name='Equation';
  page.innerHTML='<div class="sectionLabel">Equation inspector <span>LIVE MODEL</span></div><p class="description">These terms are computed in the numerical solver. The artwork is a measurement of the simulated field, not an independently animated preset.</p>';
  page.appendChild(mathEl);groupsEl.appendChild(page);
  activateGroup(activeGroup);updateEquation();
}
let pendingStill=false;
function requestStill(){if(pendingStill)return;pendingStill=true;requestAnimationFrame(()=>{pendingStill=false;recomputeStill();updateUI();});}
function addPresets(){
  let active='';
  function setActive(name){ active=name; [...presetRow.children].forEach(b=>b.classList.toggle('active', b.textContent===name)); }
  for(const [name,vals] of Object.entries(presets)){
    const b=document.createElement('button'); b.className='preset'; b.textContent=name;
    b.onclick=()=>{ applyValues(vals); setActive(name); };
    presetRow.appendChild(b);
  }
  const rnd=document.createElement('button');rnd.className='preset';rnd.textContent='Surprise';rnd.onclick=()=>{randomizeInteresting();setActive('')};presetRow.appendChild(rnd);setActive('');
}
function applyValues(vals){
  for(const [k,val] of Object.entries(vals)){
    P[k]=val;
    if(inputs[k]){ inputs[k].value = val; inputs[k].parentElement.querySelector('.val').textContent = formatVal(val); }
  }
  updateEquation();if(!running) requestStill(); else updateUI(true);
}
function randomizeInteresting(){
  const keys = ['tension','biharm','dispersion','mixX','neighbor','longCouple','cubic','quintic','exp','feedback','drive','driveFreq','beat','phaseLock','phaseSlip','heteroAmp','macro','fold','symmetry','amplitude','density','glow','depthHue','curvHue'];
  for(const key of keys){
    const item = spec.flatMap(g=>g.items).find(i=>i[0]===key); if(!item) continue;
    const [,,min,max,,,] = item;
    let t = (rng()+rng()+rng())/3; // bias center
    const val = min + t*(max-min);
    P[key]=val;
    if(inputs[key]){ inputs[key].value=val; inputs[key].parentElement.querySelector('.val').textContent = formatVal(val); }
  }
  updateEquation();if(!running) requestStill(); else updateUI(true);
}

runBtn.onclick = ()=>{
  running = !running;
  if(!running){ captureAnchor(); computeBaseline(); recomputeStill(); } else { previewDelta=0; }
  updateUI();
};
refBtn.onclick = ()=>{ running=false; captureAnchor(); computeBaseline(); recomputeStill(); updateUI(); };
exploreBtn.onclick = ()=>{ exploring=!exploring; if(exploring){running=true;reseedTargets();} updateUI(true); };
randomBtn.onclick = ()=>{ randomizeInteresting(); };

canvas.addEventListener('pointerdown', e=>{ dragState={x:e.clientX, y:e.clientY, yaw:P.yaw, tilt:P.tilt}; canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', e=>{
  if(!dragState) return;
  P.yaw = clip(dragState.yaw + (e.clientX-dragState.x)*0.006, -2.4, 2.4);
  P.tilt = clip(dragState.tilt + (e.clientY-dragState.y)*0.004, -1.1, 1.1);
  if(inputs.yaw){ inputs.yaw.value=P.yaw; inputs.yaw.parentElement.querySelector('.val').textContent = formatVal(P.yaw); }
  if(inputs.tilt){ inputs.tilt.value=P.tilt; inputs.tilt.parentElement.querySelector('.val').textContent = formatVal(P.tilt); }
  if(!running) draw();
});
canvas.addEventListener('pointerup', ()=>dragState=null); canvas.addEventListener('pointercancel', ()=>dragState=null);

addControls(); addPresets(); resize(); initialize(0.5); recomputeStill(); updateUI(true);
const fullBtn=document.getElementById('expandBtn');
fullBtn.onclick=()=>{const on=document.getElementById('app').classList.toggle('full');fullBtn.textContent=on?'Close':'Expand';resize();draw()};
window.__omefTest={
  stats:()=>({steps,vel:lastVel,delta:previewDelta,running,pixels:W*H}),
  advance:(n=1)=>{for(let i=0;i<n;i++)step(.032);draw();},
  parameter:(k,value)=>{if(!(k in P))throw Error('bad key');P[k]=value;if(inputs[k]){inputs[k].value=value;inputs[k].parentElement.querySelector('.val').textContent=formatVal(value);}if(!running)recomputeStill();},
  snapshot:()=>Array.from(q[0]).slice(0,32)
};
requestAnimationFrame(animate);
})();
</script></body></html>
