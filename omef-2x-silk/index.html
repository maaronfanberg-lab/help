<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050608"><meta name="apple-mobile-web-app-capable" content="yes"><title>OMEF · Floating Folds Studio 09</title><style>
:root{color-scheme:dark;--b:#06080b;--panel:#0e1117;--raised:#151a22;--line:#28313b;--text:#f3f4f5;--muted:#8e9aa7;--accent:#afe6dd}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;background:var(--b);display:flex;flex-direction:column;overflow:hidden}
#stageWrap{height:40dvh;min-height:240px;max-height:55dvh;flex:none;background:#000;position:relative;overflow:hidden;border-bottom:1px solid #161a20}
#stageWrap::before{content:"";position:absolute;top:0;left:0;right:0;height:62px;z-index:1;pointer-events:none;background:linear-gradient(to bottom,#000a,transparent)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;z-index:2;top:max(9px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:7px}
.identity{color:#f2f2f3;text-shadow:0 1px 5px #000,0 0 18px #000;font-size:12px;font-weight:760;letter-spacing:.12em;text-shadow:0 1px 4px #000;min-width:0;flex:1}
.identity span{font-weight:400;color:#8a969e;margin-left:6px;letter-spacing:.025em;font-size:10px}
.iconbtn{background:#11161bed;color:#e5eced;border:1px solid #39414a;border-radius:10px;padding:8px 10px;font-size:11px;white-space:nowrap}
.iconbtn.active{background:#d3efe8;color:#132825;border-color:#d3efe8}
#status{position:absolute;left:14px;bottom:48px;font:10px ui-monospace,SFMono-Regular,monospace;letter-spacing:.03em;color:#b6ced0;background:#02050777;border-radius:7px;padding:5px 7px;pointer-events:none;white-space:nowrap}
#gestureHint{position:absolute;right:11px;top:66px;color:#a0b8c0;background:#03080ab5;border-radius:7px;padding:5px 7px;font:9px ui-monospace,SFMono-Regular,monospace;z-index:2;pointer-events:none}#stage{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.presetRow{position:absolute;bottom:9px;left:10px;right:10px;z-index:2;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.presetRow::-webkit-scrollbar{display:none}
.preset{font-size:10px;letter-spacing:.01em;color:#dae2e5;padding:7px 12px;border:1px solid #3b4045;border-radius:100px;background:#0a1015c9;white-space:nowrap}
.preset.active{color:#d8f8ed;border-color:#b1dfd3;background:#19352fa6}
#panel{flex:1;min-height:0;background:var(--panel);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.panelTitle{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 11px;gap:12px}
.panelTitle strong{font-size:15px;font-weight:680;letter-spacing:-.015em}
.panelTitle small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
#modeText{font-size:9px;letter-spacing:.12em;font-weight:700;color:var(--accent);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 10px;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabBtn{position:relative;flex:none;border:0;background:none;color:#8d9ba6;font-size:11px;font-weight:600;padding:12px 10px 13px;white-space:nowrap}
.tabBtn.selected{color:#f3f6f5}.tabBtn.selected:after{content:'';position:absolute;height:2px;bottom:0;left:10px;right:10px;background:#b6e9db;border-radius:3px}
#groups{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 12px 30px}
.tabPage{display:none}.tabPage.selected{display:block}
.sectionLabel{font-size:11px;text-transform:uppercase;letter-spacing:.10em;color:#c0cbd1;padding:17px 3px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:720}
.sectionLabel span{letter-spacing:normal;font-weight:440;color:#7f929f;text-transform:none;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.control{display:block;min-width:0;padding:13px 11px 10px;background:#151a20;border-radius:11px;border:1px solid #252d35;min-height:100px}
.control header{display:flex;gap:5px;align-items:center;justify-content:space-between;margin-bottom:12px}
.control .name{font-size:11px;color:#cfd6dc;min-width:0;overflow-wrap:anywhere}
.control .val{font-size:11px;color:#b2e8dc;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,monospace;white-space:nowrap}
.control input{width:100%;display:block;accent-color:#a9e9de;touch-action:pan-y;height:23px;margin:0}
.control small{font-size:9px;color:#8295a3;line-height:1.25;margin-top:6px;display:block}
#mathReadout{font:11px/1.8 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#c5e6df;background:#151c22;border:1px solid #34454b;border-radius:12px;padding:14px;margin:9px 0}
.description{font-size:12px;line-height:1.5;color:#94a4b3;margin:8px 2px}
#app.full #stageWrap{height:100dvh;min-height:0;max-height:none;flex:1}
#app.full #panel{display:none}
@media(min-width:720px){#app{max-width:850px;margin:0 auto;border-inline:1px solid #222}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}#stageWrap{height:48dvh}}
@media(max-width:490px){.identity span{display:none}.identity{letter-spacing:.09em}.topbar{gap:5px;left:10px;right:10px}.iconbtn{padding:8px 9px}}
@media(max-height:610px){#stageWrap{min-height:195px;height:40dvh}.control{min-height:90px}}

/* Studio 08: fixed, unobstructed artwork preview above scrolling adjustments */
#stageWrap{height:44dvh;min-height:260px;max-height:52dvh}
#stageWrap::before{height:54px}
#status{bottom:5px;left:10px;z-index:2;opacity:.75;padding:3px 6px;font-size:9px}
#gestureHint{display:none}
#app.full #gestureHint{display:block}
#panel>.presetRow{position:relative;bottom:auto;left:auto;right:auto;z-index:1;flex:0 0 auto;min-height:42px;padding:6px 9px 7px;border-bottom:1px solid var(--line);background:#0e1117}
#panel>.presetRow .preset{padding:6px 10px}
#panelTitle{flex:0 0 auto}
@media(max-height:610px){#stageWrap{height:43dvh;min-height:180px;max-height:50dvh}}
#app.full #stageWrap{height:100dvh;max-height:none;min-height:0}
</style></head><body><div id="app"><div id="stageWrap">

function updateArtFrame(){
  const expanded=isExpanded();
  if(!expanded){
    compactW=W; compactH=H;
    // Keep all artwork below the toolbar and above the bottom status strip.
    // Presets are now in the panel, never on top of the sculpture.
    const top=(H>=245?55:43), bottom=(H>=245?22:17);
    artW=Math.max(20,W-16); artH=Math.max(20,H-top-bottom);
    artX=8; artY=top;
    return;
  }
  // A black letterbox in expanded view is deliberate: the work never gets
  // vertically stretched by a taller phone screen.
  const factor=Math.min(1, W/Math.max(1,compactW), H/Math.max(1,compactH));
  artW=compactW*factor; artH=Math.max(20,compactH-77)*factor;
  artX=Math.round((W-artW)/2); artY=Math.round((H-artH)/2);

function clearState(){
  for(let r=0;r<R;r++){
    q[r].fill(0); v[r].fill(0); q2[r].fill(0); v2[r].fill(0);
    phi[r]=0; phi2[r]=0;
  }
}
function initialize(seedJolt=0){
  clearState(); steps=0;
  for(let r=0;r<R;r++){
    const basePhase = TWO*r/R;
    phi[r] = basePhase*.45 + (rng()-.5)*0.08;
    for(let i=0;i<N;i++){
      const x = i/N*TWO;
      const field = 0.32*Math.sin(1.7*x + basePhase) + 0.18*Math.sin(3.3*x - basePhase*1.2) + 0.08*Math.cos(6.8*x + r*0.17);
      q[r][i] = field + seedJolt*(rng()-.5)*0.12;
      v[r][i] = 0.05*Math.sin(2.2*x + r*0.2) + seedJolt*(rng()-.5)*0.02;
    }
  }
  captureAnchor();
  computeBaseline();
}
function clone2D(arr){ return arr.map(a=>new Float32Array(a)); }
function captureAnchor(){
  anchorQ = clone2D(q); anchorV = clone2D(v); anchorPhi = new Float32Array(phi); anchorSteps = steps;
}
function restoreAnchor(){
  for(let r=0;r<R;r++){ q[r].set(anchorQ[r]); v[r].set(anchorV[r]); phi[r]=anchorPhi[r]; }
  steps = anchorSteps;
}
function computeBaseline(){
  restoreAnchor();

  baselineQ = clone2D(q); baselineV = clone2D(v); baselinePhi = new Float32Array(phi);
  restoreAnchor(); previewDelta = 0;
}
function fieldAt(arr,r,i){ return arr[mod(r,R)][mod(i,N)] }
function hetero(r,i){
  const x=i/N*TWO, y=r/R*TWO;

}
function step(dt){
  const dt2 = dt*P.tempo;
  let velSum=0;
  // phase evolution per ribbon
  for(let r=0;r<R;r++){
    const ph=phi[r], phL=phi[mod(r-1,R)], phR=phi[mod(r+1,R)], qMid=q[r][(steps+r*13)%N];
    // Principal complex logarithm: Im log(a + i b) = atan2(b,a).
    // q and velocity both enter this phase feedback, rather than a renderer trick.
    const sampleI=(steps+r*13)%N;
    const phaseArg=Math.atan2(P.logBeta*v[r][sampleI], P.logOffset+P.logAlpha*Math.tanh(qMid));
    const dph = 0.18 + P.phaseLock*(Math.sin(phL-ph)+Math.sin(phR-ph)) - P.phaseSlip*Math.sin(2.7*ph + 0.4*r) + 0.12*P.feedback*qMid + P.logPhase*phaseArg;
    phi2[r] = ph + dt2*dph;
  }
  for(let r=0;r<R;r++){
    const rr = q[r], vv = v[r], nr = q2[r], nv = v2[r];
    const qU = q[mod(r-1,R)], qD = q[mod(r+1,R)], qUU = q[mod(r-2,R)], qDD = q[mod(r+2,R)];
    const vU = v[mod(r-1,R)], vD = v[mod(r+1,R)];
    const basePhase = phi[r], clock = steps*dt2;
    for(let i=0;i<N;i++){
      const qm2=rr[mod(i-2,N)], qm1=rr[mod(i-1,N)], q0=rr[i], qp1=rr[mod(i+1,N)], qp2=rr[mod(i+2,N)];
      const lap = qp1 - 2*q0 + qm1;
      const bih = qm2 - 4*qm1 + 6*q0 - 4*qp1 + qp2;
      const d1 = 0.5*(qp1 - qm1);
      const d3 = 0.5*(qp2 - 2*qp1 + 2*qm1 - qm2);
      const across = qD[i] - 2*q0 + qU[i];
      const longAcross = qDD[i] - 2*q0 + qUU[i];
      const mix = 0.25*((qD[mod(i+1,N)]-qD[mod(i-1,N)]) - (qU[mod(i+1,N)]-qU[mod(i-1,N)]));
      const velAcross = vD[i] - 2*vv[i] + vU[i];
      const amp = Math.abs(q0);
      const sign = q0===0?0:Math.sign(q0);
      const non = -P.cubic*sign*Math.pow(amp,P.exp)/(1 + P.saturate*amp*amp);
      const quint = -P.quintic*q0*q0*q0*q0*q0;
      const het = hetero(r,i);
      const symBias = P.symmetry*((r&1)?1:-1)*0.08;
      const x = i/N*TWO; const y = r/R*TWO;
      const drive = P.drive*(Math.sin(P.driveFreq*clock + x*(1+0.35*P.anisotropy) + basePhase) + 0.65*Math.sin((P.driveFreq+P.beat)*clock - 1.4*x + .8*y));
      const macro = P.macro*(0.55*Math.sin(0.21*clock + 0.8*x + 2.0*y) + 0.4*Math.cos(0.13*clock - 1.2*x + 0.5*y));
      const curvature = P.curvatureDrive*lap*Math.tanh(0.8+Math.abs(q0));
      const reson = P.resonance*Math.sin(2.3*clock + 5*x + y)*Math.exp(-3*Math.abs(q0));
      const feedbackDrive = P.feedback*(0.45*Math.tanh(q0) + 0.25*Math.tanh(across));
      // z = a + i*b. Principal complex log(z) = 1/2 ln(a²+b²) + i atan2(b,a).
      // Offsetting the real part ensures tunable distance to z=0; log modulus
      // is epsilon-regularized while the genuine principal argument is retained.
      const logRe = P.logOffset + P.logAlpha*Math.tanh(q0);
      const logIm = P.logBeta*(vv[i] + 0.24*across);
      const imaginaryLog = Math.atan2(logIm,logRe);
      const realLog = 0.5*Math.log(Math.max(1e-8,logRe*logRe+logIm*logIm));
      const coupledLog = Math.atan2(P.logBeta*across, P.logOffset+P.logAlpha*Math.tanh(d1));
      const curvedLog = Math.atan2(P.logBeta*lap, P.logOffset+P.logAlpha*Math.tanh(d3));
      const complexLogForce = P.logForce*imaginaryLog + P.logCouple*coupledLog + P.logCurve*curvedLog

      const accel =
        P.tension*lap - P.biharm*bih + P.advection*d1 + P.dispersion*d3 + P.mixX*mix + P.neighbor*across + P.longCouple*longAcross + P.shear*(qD[mod(i+1,N)]-qU[mod(i+1,N)] - qD[mod(i-1,N)] + qU[mod(i-1,N)])*0.25
        + non + quint + curvature + drive + reson + feedbackDrive + macro + het + symBias + complexLogForce + P.crossMod*(qU[i]*qD[i]-q0*q0)*0.08 + P.fold*(r/(R-1)-0.5);
      const vel = vv[i];
      const localPump = P.pump*(P.pumpTarget*P.pumpTarget - vel*vel)*vel;
      const damp = P.damping*vel;
      nr[i] = q0 + dt2*vel;

  }

  steps++;
}
function calcDelta(){

function recomputeStill(){

function project(x,y,z){
  const cy=Math.cos(P.yaw), sy=Math.sin(P.yaw);

  const ct=Math.cos(P.tilt), st=Math.sin(P.tilt);

function renderBg(){

// SILK RIBBON VIEW — the geometry is a smooth observation of the evolved
// OMEF ribbon fields q[r][i]. A twisted 3-D embedding supplies coordinates,
// not an independently evolving animation.
const silkNodes = [
  [ 0.00, -0.01, 0.00], [ 0.92, 0.34, 0.04], [ 1.60, 0.39, 0.08],
  [ 1.73, -0.12, 0.10], [ 1.20,-0.51,-0.04], [ 0.25,-0.71,-0.08],
  [-0.92,-0.75,-0.01], [-1.57,-0.47, 0.03], [-1.35,-0.05, 0.04],
  [-1.64, 0.53, 0.04], [-1.28, 0.85, 0.08], [-1.25, 0.25, 0.02],

const silkHue = [185,213,255,293,333,350,378,415,431,420,458,508,545];
function cr(a,b,c,d,t){

function silkHueAt(u){
  const x=clip(u,0,0.99999)*(silkHue.length-1),k=Math.floor(x),f=x-k;

}
const silkSmooth=new Float32Array(R*N);
function updateSilkSmooth(){

  // preserving the same structures while avoiding aliasing into the strands.
  const w=[1,3,5,7,5,3,1], norm=25*25;
  for(let r=0;r<R;r++)for(let i=0;i<N;i++){

}
function silkSample(rf,u){

function silkPoint(u,w){

function drawComputed(){

  const strands=Math.max(54,Math.min(175,Math.round(artW*.20*P.density*(running?.82:1)))); 
  const points=running?164:226;

  const alpha=clip(P.alpha*.56,.08,.44);
  ctx.lineCap='butt';ctx.lineJoin='round';
  // Calculate all ribbons first, and paint rear to front for coherent depth.
  const bands=[];
  for(let r=0;r<strands;r++){
    const w=-1+2*r/(strands-1),pts=[];
    let depth=0;
    for(let j=0;j<points;j++){
      const u=j/(points-1),p=silkPoint(u,w);

    }
    bands.push({w,pts,depth:depth/points,index:r});
  }
  bands.sort((a,b)=>a.depth-b.depth);
  for(const band of bands){
    // 20 subtly blended color arcs, each covering a smooth portion of

    const w=band.w,pts=band.pts,weight=(.6+.4*(w+1)/2);
    for(let segment=0;segment<segs;segment++){

      const last=Math.min(points-1,Math.round((segment+1)*(points-1)/segs));
      const u=(segment+.5)/segs;
      const hueFor=(uu)=>(silkHueAt(uu)*P.hueSpin+P.depthHue*w*24+P.curvHue*.65*Math.tanh(silkSample((w+1)/2,uu)));
      const luminance=(uu)=>clip(59+7*P.contrast*weight+5*Math.cos(w*2.4+uu*9),43,78);

      const p0=pts[first],p1=pts[last];

      for(const [f,uu] of [[0,first/(points-1)],[1,last/(points-1)]]){

// FLOATING FOLDS — a reference-guided geometric embedding, not a baked image.
// Coordinates are smoothly deformed by the *evolved* q[r][i] and phi[r]
// (including the existing real/imaginary logarithmic forces).
const foldPalette=[71,92,149,184,209,239,277,309,326];
function foldHue(t){
  const a=clip(t,0,.99999)*(foldPalette.length-1);
  const j=a|0;return lerp(foldPalette[j],foldPalette[j+1],a-j);
}
function foldPoint(t,w,sheet){
  // Two connected, open wave sheets: arch, central saddle, and raised wing.
  // This is a view-only embedding; no independent motion is generated here.
  const s=t;
  const arch=Math.exp(-Math.pow((s-.27)/.255,2));
  const wing=Math.exp(-Math.pow((s-.83)/.255,2));
  const saddle=Math.exp(-Math.pow((s-.56)/.145,2));
  const pinch=(1-.77*Math.exp(-Math.pow((s-.535)/.11,2)));
  const side=(sheet===0?-1:1);
  const tShift=sheet===0?-.11:.11;
  const transverse=P.foldFan*(.50+.28*arch+.26*wing)*pinch*w;
  // At the crossing, the transverse direction rotates from y to depth.
  const spin=(1.18+P.foldCross*1.05)*Math.PI*s+side*.23;
  const flared=transverse*Math.cos(spin);
  const x0=3.6*(s-.50)+(sheet===0?-.06:.06)+.14*w*Math.sin(Math.PI*s);
  const y0= -0.25 + P.foldArc*(.79*arch+.65*wing-.36*saddle) + .20*side*saddle;
  // The second sheet diverges at the right; their intersection remains open.
  const y=y0+flared+ .24*(sheet===1?wing:-arch)*w;
  const z=.20*side*saddle+transverse*Math.sin(spin)*1.10 + .11*side*wing;
  const rf=clip((w+1)/2,0,1);
  const source=silkSample(rf,s);
  const neighboring=silkSample(1-rf,s);
  const center=silkSample(.5,s);
  const deform=P.foldWave*P.silkResponse*P.amplitude;
  const wave=Math.tanh(source*1.15);
  const common=Math.tanh(center);
  const exchange=Math.tanh(source-neighboring);
  // Local field affects all three spatial coordinates (not merely color).
  const xx=x0+deform*(.070*exchange+.030*wave);
  const yy=y+deform*(.16*wave+.09*common);
  const zz=z+deform*(.09*exchange+.025*wave);
  const cy=Math.cos(P.yaw*.55),sy=Math.sin(P.yaw*.55);
  const X=cy*xx+sy*zz,Z=-sy*xx+cy*zz;
  const ct=Math.cos(P.tilt-.64),st=Math.sin(P.tilt-.64);
  const Y=ct*yy-st*Z, depth=st*yy+ct*Z;
  const rc=Math.cos(P.roll),rs=Math.sin(P.roll);
  const outX=rc*X-rs*Y, outY=rs*X+rc*Y;
  const base=Math.min(artW/4.55,artH/2.9)*P.zoom*P.xSpread;
  const persp=clip(1/(1+depth*.12*P.perspective),.79,1.18);
  return [artX+artW*.5+outX*base*persp,
    artY+artH*.53-outY*base*persp*P.yCompress,depth];
}
function drawFolds(){
  renderBg(); updateSilkSmooth();
  const total=Math.max(72,Math.min(210,Math.round(83*P.foldDensity*P.density)));
  const samples=running?112:170;
  const bands=[];
  for(let sheet=0;sheet<2;sheet++)for(let i=0;i<total;i++){
    const w=-1+2*i/(total-1),pts=[];let z=0;
    for(let j=0;j<samples;j++){
      const t=j/(samples-1),p=foldPoint(t,w,sheet);
      pts.push(p);z+=p[2];
    }
    bands.push({sheet,w,pts,depth:z/samples});
  }
  bands.sort((a,b)=>a.depth-b.depth);
  ctx.lineCap='round';ctx.lineJoin='round';
  const al=clip(.31+P.alpha*.38,.12,.77);
  // Layered strokes: subtle bloom for luminous silk without obscuring gaps.
  for(const band of bands){
    const {sheet,w,pts}=band;
    for(let part=0;part<9;part++){
      const first=Math.round(part*(samples-1)/9);
      const last=Math.round((part+1)*(samples-1)/9);
      const s=(part+.5)/9;
      const h0=foldHue(clip((w+1)/2,0,1));
      const hue=((h0*P.hueSpin + P.depthHue*sheet*15 + P.curvHue*14*Math.tanh(silkSample((w+1)/2,s)))%360+360)%360;
      const intensity=clip(61+5*P.contrast+7*Math.sin(w*1.6+s*2),37,84);
      const tr=(w+1)/2;
      const color=`hsl(${hue.toFixed(1)} 94% ${intensity.toFixed(1)}%)`;
      const path=()=>{
        ctx.beginPath();ctx.moveTo(pts[first][0],pts[first][1]);
        for(let j=first+1;j<=last;j++)ctx.lineTo(pts[j][0],pts[j][1]);
        ctx.stroke();
      };
      ctx.strokeStyle=color;
      // minimal halo (important to preserve individually resolved strands)
      if(P.glow>.5 && part%2===0){
        ctx.globalAlpha=al*.055*P.glow;
        ctx.lineWidth=1.25+P.thickness*.5;path();
      }
      ctx.globalAlpha=al*(.65+.35*tr);
      ctx.lineWidth=.32+.39*P.thickness;
      path();
    }
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

// SOURCE-ACCURATE RENDERING. The user's image supplies the original fine
// filament material; the OMEF numerical state supplies a differentiable
// warp to it. This is explicitly a texture-based visualization rather than
// a claim that the model generated the original reference artwork.
let renderVariant='folds',referenceMode=false,referenceReady=false;
const referenceImage=new Image();
referenceImage.onload=()=>{referenceReady=true;if(baselineQ)draw();};
referenceImage.onerror=()=>{referenceReady=false;if(baselineQ)draw();};
referenceImage.src=document.getElementById('fallbackPreview').src;
function fieldDisplacement(u){
  const idx=clip(Math.floor(u*(N-1)),0,N-1);
  const rows=[4,10,16,22,30];let dy=0,dx=0;
  // Spatial averaging is a *measurement filter*. It prevents numerical
  // high-frequency modes from tearing the supplied fine artwork into strips.
  for(let j=0;j<rows.length;j++){
    const r=rows[j];let sum=0,wsum=0;
    for(let k=-18;k<=18;k+=2){
      const ii=clip(idx+k,0,N-1),weight=.5+.5*Math.cos(Math.PI*k/20);
      const base=baselineQ?.[r]?.[ii]??q[r][ii];
      sum+=weight*(q[r][ii]-base);wsum+=weight;
    }
    const d=sum/(wsum||1);
    dy+=d*Math.sin(.8+j*1.1+u*3.7);
    dx+=d*Math.cos(j*.64+u*5.1);
  }
  return [dy*.44,dx*.29];
}
function drawReference(){
  if(!referenceReady){drawComputed();return;}
  renderBg();
  const ar=referenceImage.width/referenceImage.height;
  const pw=Math.min(artW*.96,artH*.96*ar),ph=pw/ar;
  const widthScale=P.zoom/1.08;
  const hScale=clip(P.yCompress,.4,2.4);
  let actualW=pw*widthScale,actualH=ph*hScale;
  if(!isExpanded()){
    // All of the current stretched artwork must fit in the preview, even
    // if a Geometry slider has increased width, height, or zoom.
    const scale=Math.min(1,artW*.965/Math.max(1,actualW),artH*.965/Math.max(1,actualH));
    actualW*=scale; actualH*=scale;
  }
  const x0=artX+(artW-actualW)*.5;
  const y0=artY+(artH-actualH)*.5;
  const isIdentity=!running && previewDelta<1e-9;
  // An identity operation preserves the supplied source material exactly.
  if(isIdentity){
    ctx.drawImage(referenceImage,x0,y0,actualW,actualH);
  }else{
    const columns=Math.max(110,Math.min(500,Math.ceil(actualW*1.05)));
    const sourceW=referenceImage.width,sourceH=referenceImage.height;
    const gain=clip(P.silkResponse*P.materialMotion*P.amplitude,0,4.5);
    for(let c=0;c<columns;c++){
      const u=(c+.5)/columns;
      const delta=fieldDisplacement(u);
      const srcX=c*sourceW/columns,srcWidth=sourceW/columns;
      const destX=x0+c*actualW/columns;
      const offsetY=clip(24*gain*Math.tanh(delta[0]*1.5),-actualH*.055,actualH*.055);

}
function draw(){

  // OMEF differential equations and the letterboxed art viewport are unchanged.
  canvas.style.filter=referenceMode?`hue-rotate(${P.materialHue}deg) brightness(${P.materialBright}) contrast(${P.materialContrast}) saturate(${P.materialSaturate})`:'none';
  ctx.save();

function updateEquation(){
  mathEl.textContent=`q̈ = ${P.tension.toFixed(2)}·Δₓq − ${P.biharm.toFixed(3)}·Δₓ⁴q + ${P.neighbor.toFixed(2)}·Δᵣq + ${P.mixX.toFixed(3)}·∂ₓΔᵣq
− ${P.cubic.toFixed(2)}·sgn(q)|q|^${P.exp.toFixed(2)}/(1+${P.saturate.toFixed(2)}q²) − ${P.quintic.toFixed(2)}q⁵
+ driving(t,x,r) + coupling(q,Δᵣq) + feedback(q) − ${P.damping.toFixed(3)}·q̇
+ ${P.pump.toFixed(3)}·(${P.pumpTarget.toFixed(2)}²−q̇²)q̇ + remaining operators

Complex logarithm:
z = ${P.logOffset.toFixed(2)} + ${P.logAlpha.toFixed(2)}·tanh(q) + i·${P.logBeta.toFixed(2)}·(q̇+0.24·Δᵣq)
log(z) = ½ ln(Re(z)²+Im(z)²) + i atan2(Im(z),Re(z))

let autoTargets={};
function reseedTargets(){
  const keys = ['tension','biharm','neighbor','cubic','exp','drive','driveFreq','beat','feedback','heteroAmp','macro','phaseLock','phaseSlip','fold','amplitude','density','glow','depthHue','curvHue','logForce','logCouple','logCurve','logPhase','logAlpha','logBeta','logOffset'];
  for(const k of keys){
    const item = spec.flatMap(g=>g.items).find(i=>i[0]===k); if(!item) continue;
    autoTargets[k] = item[1] ? null : null;
  }
  for(const group of spec) for(const item of group.items){
    const [k,,min,max] = item;
    if(k in autoTargets) autoTargets[k] = min + rng()*(max-min);
  }
}
function autoMorph(){
  if(!Object.keys(autoTargets).length) reseedTargets();
  let settled = 0, total = 0;
  for(const [k,target] of Object.entries(autoTargets)){
    total++;
    P[k] = lerp(P[k], target, 0.006);
    if(Math.abs(P[k]-target)<0.015) settled++;
    if(inputs[k]){ inputs[k].value = P[k]; inputs[k].parentElement.querySelector('.val').textContent = formatVal(P[k]); }
  }
  if(settled > total*0.85) reseedTargets();
}

    btn.onclick=()=>activateGroup(group.group);tabBar.appendChild(btn);
    const section=document.createElement('section');section.className='tabPage';section.dataset.name=group.group;
    section.innerHTML=`<div class="sectionLabel">${group.group} <span>${group.items.length} parameters</span></div><div class="grid"></div>`;
    const grid=section.querySelector('.grid');
    for(const item of group.items){
      const [key,label,min,max,def,step,desc]=item;
      const card=document.createElement('label');card.className='control';
      card.innerHTML=`<header><span class="name">${label}</span><output class="val">${formatVal(def)}</output></header><input type="range" min="${min}" max="${max}" step="${step}" value="${def}" aria-label="${label}"><small>${desc}</small>`;
      const input=card.querySelector('input');inputs[key]=input;
      input.addEventListener('input',()=>{
        // Every adjustment starts with the full sculpture visible.
        fitAdjustmentView();
        P[key]=Number(input.value);card.querySelector('.val').textContent=formatVal(P[key]);
        updateEquation();
        if(!running){
          if(['amplitude','ribbonGap','xSpread','yCompress','perspective','tilt','yaw','roll','zoom','density','thickness','glow','alpha','hueSpin','depthHue','curvHue','contrast','trail','foldArc','foldFan','foldCross','foldWave','foldDensity','silkWidth','silkTwist','silkPinch','silkResponse','materialHue','materialBright','materialContrast','materialSaturate','materialMotion'].includes(key))draw();
          else requestStill();
        }
      });
      grid.appendChild(card);
    }
    groupsEl.appendChild(section);
  }
  const eq=document.createElement('button');eq.className='tabBtn';eq.textContent='Equation';eq.dataset.group='Equation';
  eq.onclick=()=>activateGroup('Equation');tabBar.appendChild(eq);
  const page=document.createElement('section');page.className='tabPage';page.dataset.name='Equation';
  page.innerHTML='<div class="sectionLabel">Equation inspector <span>LIVE MODEL</span></div><p class="description">These terms are computed in the numerical solver. The artwork is a measurement of the simulated field, not an independently animated preset.</p>';
  page.appendChild(mathEl);groupsEl.appendChild(page);
  activateGroup(activeGroup);updateRenderTabs();updateEquation();
}
let pendingStill=false;
function requestStill(){if(pendingStill)return;pendingStill=true;requestAnimationFrame(()=>{pendingStill=false;recomputeStill();updateUI();});}
function addPresets(){
  stretchBtn=document.createElement('button');stretchBtn.className='preset';stretchBtn.title='Off: proportional two-finger zoom. On: independently stretch horizontal and vertical dimensions.';
  stretchBtn.onclick=()=>{
    view.freeStretch=!view.freeStretch;
    if(!view.freeStretch){
      // Return to a single uniform scale around the viewport center.
      const scale=Math.sqrt(view.sx*view.sy),cx=W*.5,cy=H*.5;
      const anchorX=(cx-view.x)/view.sx,anchorY=(cy-view.y)/view.sy;
      view.sx=scale;view.sy=scale;view.x=cx-scale*anchorX;view.y=cy-scale*anchorY;
    }
    syncViewButtons();draw();
  };
  resetBtn=document.createElement('button');resetBtn.className='preset';resetBtn.onclick=()=>{resetView();fitAdjustmentView();draw();};
  presetRow.appendChild(stretchBtn);presetRow.appendChild(resetBtn);syncViewButtons();
  const viewButton=document.createElement('button');viewButton.className='preset active';viewButton.textContent='View: Floating folds';
  viewButton.onclick=()=>{
    renderVariant=renderVariant==='folds'?'classic':renderVariant==='classic'?'reference':'folds';
    referenceMode=(renderVariant==='reference');
    viewButton.textContent=renderVariant==='folds'?'View: Floating folds':renderVariant==='classic'?'View: Classic fibers':'View: Reference silk';
    viewButton.classList.toggle('active',renderVariant==='folds');updateRenderTabs();draw();
  };
  presetRow.appendChild(viewButton);
  let active='';
  function setActive(name){ active=name; [...presetRow.children].filter(b=>b!==viewButton).forEach(b=>b.classList.toggle('active', b.textContent===name)); }
  for(const [name,vals] of Object.entries(presets)){
    const b=document.createElement('button'); b.className='preset'; b.textContent=name;
    b.onclick=()=>{ applyValues(vals); setActive(name); };
    presetRow.appendChild(b);
  }
  const rnd=document.createElement('button');rnd.className='preset';rnd.textContent='Surprise';rnd.onclick=()=>{randomizeInteresting();setActive('')};presetRow.appendChild(rnd);setActive('');
}
function applyValues(vals){
  fitAdjustmentView();
  for(const [k,val] of Object.entries(vals)){
    P[k]=val;
    if(inputs[k]){ inputs[k].value = val; inputs[k].parentElement.querySelector('.val').textContent = formatVal(val); }
  }
  updateEquation();if(!running) requestStill(); else updateUI(true);
}
function randomizeInteresting(){
  const keys = ['tension','biharm','dispersion','mixX','neighbor','longCouple','cubic','quintic','exp','feedback','drive','driveFreq','beat','phaseLock','phaseSlip','heteroAmp','macro','fold','symmetry','amplitude','density','glow','depthHue','curvHue','logForce','logCouple','logCurve','logPhase','logAlpha','logBeta','logOffset'];
  for(const key of keys){
    const item = spec.flatMap(g=>g.items).find(i=>i[0]===key); if(!item) continue;
    const [,,min,max,,,] = item;
    let t = (rng()+rng()+rng())/3; // bias center
    const val = min + t*(max-min);
    P[key]=val;
    if(inputs[key]){ inputs[key].value=val; inputs[key].parentElement.querySelector('.val').textContent = formatVal(val); }
  }
  updateEquation();if(!running) requestStill(); else updateUI(true);
}

runBtn.onclick = ()=>{
  running = !running;
  if(!running){ captureAnchor(); computeBaseline(); recomputeStill(); } else { previewDelta=0; }
  updateUI();
};
refBtn.onclick = ()=>{ running=false; captureAnchor(); computeBaseline(); recomputeStill(); updateUI(); };
exploreBtn.onclick = ()=>{ exploring=!exploring; if(exploring){running=true;reseedTargets();} updateUI(true); };
randomBtn.onclick = ()=>{ randomizeInteresting(); };

// Real two-pointer gestures, independent of the OMEF simulation timestep.
// One finger preserves the earlier orbit action; two fingers zoom and pan.
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  startTouchGesture();
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  e.preventDefault();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moveTouchGesture();
});
function endPointer(e){
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);
  try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}catch(_){}
  startTouchGesture();
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('lostpointercapture',endPointer);
// Keep iOS Safari from treating a gesture over the sculpture as a page zoom.
for(const name of ['gesturestart','gesturechange','gestureend','touchmove'])
  canvas.addEventListener(name,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const b=stageWrap.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  const next=clip(view.sx*Math.exp(-e.deltaY*.002),.35,7.5);
  const ratio=next/view.sx;
  view.x=x-(x-view.x)*ratio;view.y=y-(y-view.y)*ratio;
  view.sx=next;view.sy=clip(view.sy*ratio,.35,7.5);
  draw();
},{passive:false});

addControls(); addPresets(); activateGroup('Complex log'); resize(); initialize(0.5); recomputeStill(); updateUI(true);
const fullBtn=document.getElementById('expandBtn');
fullBtn.onclick=()=>{
  const app=document.getElementById('app');
  const on=!app.classList.contains('full');
  if(on){
    // Start expanded inspection with a full fit; the user can then pinch.
    Object.assign(view,{sx:1,sy:1,x:0,y:0,freeStretch:false});
    app.classList.add('full');
  }else{
    saveInspectView();
    app.classList.remove('full');
    fitAdjustmentView();
  }
  fullBtn.textContent=on?'Adjust':'Expand';
  resize();draw();
};
window.__omefTest={
  view:()=>viewStats(),
  resetView:()=>resetView(),
  stretch:(on)=>{view.freeStretch=!!on;syncViewButtons();draw();},
  stats:()=>({steps,vel:lastVel,delta:previewDelta,running,pixels:W*H,art:{x:artX,y:artY,width:artW,height:artH},expanded:document.getElementById('app').classList.contains('full')}),
  advance:(n=1)=>{for(let i=0;i<n;i++)step(.032);draw();},
  parameter:(k,value)=>{if(!(k in P))throw Error('bad key');P[k]=value;if(inputs[k]){inputs[k].value=value;inputs[k].parentElement.querySelector('.val').textContent=formatVal(value);}if(!running)recomputeStill();},
  snapshot:()=>Array.from(q[0]).slice(0,32),
  renderMode:()=>renderVariant,
  summary:()=>({maxq:Math.max(...q.map(a=>Math.max(...a.map(x=>Math.abs(x))))), rmsV:lastVel, fieldsFinite:q.every(a=>a.every(Number.isFinite)), referenceMode,referenceReady, logTerms:{logForce:P.logForce,logCouple:P.logCouple,logCurve:P.logCurve,logPhase:P.logPhase,logAlpha:P.logAlpha,logBeta:P.logBeta,logOffset:P.logOffset}}),
  keys:()=>Object.keys(P)
};
requestAnimationFrame(animate);
const fallback=document.getElementById('fallbackPreview');
if(fallback)fallback.style.display='none';
window.__omefBootReady=true;
const watchdog=document.getElementById('bootWatchdog');if(watchdog)watchdog.style.display='none';
}catch(err){
  window.__omefBootError=String(err&&err.stack||err);
  const status=document.getElementById('status');if(status)status.textContent='STARTUP ERROR';
  const watch=document.getElementById('bootWatchdog');if(watch){watch.style.display='block';watch.textContent='Startup failed: '+String(err&&err.message||err).slice(0,180);}
  console.error('OMEF boot failure',err);
}
})();
</script></body></html>
