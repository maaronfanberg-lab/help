 let coords=[sc*q[0]+n[0]*cross+b[0]*zdepth,sc*q[1]+n[1]*cross+b[1]*zdepth,sc*q[2]+n[2]*cross+b[2]*zdepth];
 if(view==='Bulk'){
  coords=[coords[0]+.35*bulkStrength,coords[1]+bulkStrength*.28,coords[2]+.22*bulkStrength];
 }else if(view==='Phase'){
  coords=[coords[0]+.14*phaseStrength*visual.phaseGain,coords[1]+.20*Math.cos(o.phase)*visual.phaseGain,coords[2]+.1*phaseStrength];
 }else if(view==='Ports'){
  coords=[coords[0]+.22*portStrength,coords[1]+.28*portStrength,coords[2]+.08*portStrength];
 }else if(view==='Qubit'){
  coords=[coords[0]+.08*quantumStrength,coords[1]+w*.25*quantumStrength,coords[2]+.30*o.qubit*visual.quantumGain];
 }
 return coords;
}
function proj(vec){
 const ya=camera.yaw,ty=camera.tilt,cy=Math.cos(ya),sy=Math.sin(ya),ct=Math.cos(ty),st=Math.sin(ty);
 let X=cy*vec[0]+sy*vec[2],Z=-sy*vec[0]+cy*vec[2],Y=ct*vec[1]-st*Z;
 let z=st*vec[1]+ct*Z;
 return [X*camera.stretchX,Y*camera.stretchY,z];
}
function pathDraw(){
 const ab=artBox();
 // Constant nominal scale, never stretched to fill expanded canvas.
 const size=Math.min(ab.w/2.9,ab.h/2.55)*camera.zoom;
 const curves=[];
 const number=Math.round(visual.fiberCount);
 let minX=1e20,maxX=-1e20,minY=1e20,maxY=-1e20;
 for(let k=0;k<number;k++){
  const w=-1+2*k/Math.max(1,number-1),arr=[];let depth=0;
  for(let t=0;t<=172;t++){
    const u=t/172;const p=proj(xyz(u,w));arr.push(p);depth+=p[2];
    minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);
  }
  curves.push({w,arr,depth:depth/173,k});
 }
 const viewCX=(minX+maxX)/2,viewCY=(minY+maxY)/2;
 const needScale=Math.min(ab.w*.83/Math.max(.1,maxX-minX),ab.h*.81/Math.max(.1,maxY-minY));
 // Fit is uniform: never distort aspect; soft only when user has not manually zoomed.
 const f= camera.zoom===1 ? Math.min(size,needScale) : size;
 curves.sort((a,b)=>a.depth-b.depth);
 for(const curve of curves){
  const k=curve.k,arr=curve.arr;
  for(let s=0;s<15;s++){
    const first=Math.floor(s*172/15),last=Math.min(172,Math.ceil((s+1)*172/15));
    const u=(s+.5)/15,o=obsAt(u,curve.w);
    const hue=((205+260*u+115*k/number+14*Math.sin(o.phase)+80*Math.tanh(visual.portGain*o.port*.1))%360+360)%360;
    const a=.38+.26*Math.abs(curve.w),light=55+12*Math.sin(u*7+k*.04);
    const draw=()=>{
      ctx.beginPath();for(let i=first;i<=last;i++){
        const p=arr[i];const px=ab.x+ab.w/2+(p[0]-viewCX)*f+camera.dx;
        const py=ab.y+ab.h/2-(p[1]-viewCY)*f+camera.dy;
        if(i===first)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    };
    ctx.strokeStyle=`hsl(${hue.toFixed(0)} 93% ${light.toFixed(0)}%)`;
    if(visual.glow>0){ctx.lineWidth=2.3*visual.thickness;ctx.globalAlpha=visual.glow*.04;draw();}
    ctx.lineWidth=Math.max(.25,visual.thickness*.77);ctx.globalAlpha=a;draw();
  }
 }
 ctx.globalAlpha=1;
}
function draw(){
 if(!ctx||!W||!H)return;
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 pathDraw();
 needRender=false;
}
function updateInputs(tabName){
 tab=tabName;for(const b of tabstrip.children)b.classList.toggle('active',b.dataset.name===tab);
 sliders.replaceChildren();
 for(const [key,label,min,max,step,explain] of configs[tab]){
  const v = key in params?params[key]:key in visual?visual[key]:key==='horizon'?horizon:runSpeed;
  const outer=document.createElement('label');outer.className='control';outer.dataset.param=key;
  const header=document.createElement('div');header.className='clabel';header.innerHTML=`<span>${label}</span><strong>${fmt(v)}</strong>`;
  const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=v;input.dataset.param=key;
  const small=document.createElement('small');small.textContent=explain;
  outer.append(header,input,small);
  input.addEventListener('input',()=>{
    let val=Number(input.value);header.querySelector('strong').textContent=fmt(val);
    if(key==='horizon'){horizon=val;if(!playing)queueRecompute();}
    else if(key==='runSpeed'){runSpeed=val;}
    else if(key in visual){visual[key]=val;needRender=true;if(!playing)draw();}
    else {params[key]=val;if(!playing)queueRecompute();}
    updateDiagnostics();
  });
  sliders.append(outer);
 }
}
for(const name of Object.keys(configs)){
 const b=document.createElement('button');b.textContent=name;b.dataset.name=name;b.className='tab';b.onclick=()=>updateInputs(name);tabstrip.append(b);
}
const vrow=el('viewrow');for(const [name,detail] of viewDefs){const b=document.createElement('button');b.className='chip';b.dataset.view=name;b.textContent=name;b.title=detail;b.onclick=()=>{view=name;for(const c of vrow.children)c.classList.toggle('active',c.dataset.view===name);draw();};vrow.append(b);}
vrow.firstElementChild.classList.add('active');
function solved(s,p,steps){let out=new Float64Array(s);for(let i=0;i<steps;i++){out=E.rk4(out,.004,p);if(!E.finite(out))throw new Error('Nonfinite solver state at preview step '+i);}return out;}
function queueRecompute(){
 const ticket=++recomputeTicket;
 el('calc').textContent='Computing source equations…';
 // single animation coalesces rapid slider input; never falsely reports completion.
 requestAnimationFrame(()=>{if(ticket!==recomputeTicket||playing)return;try{
  S=solved(base,params,horizon);stepCount=horizon;
  if(!baseline||!E.finite(baseline)) baseline=solved(base,refParams,horizon);
  let norm=0;for(let j=0;j<l.D;j++)norm+=(S[j]-baseline[j])**2;
  currentDelta=Math.sqrt(norm/l.D);el('calc').textContent=`Source solver · ${l.D} coordinates · Δ ${currentDelta.toExponential(2)}`;
  updateDiagnostics();draw();
 }catch(e){reportError(e);}});
}
function start(){playing=!playing;el('play').textContent=playing?'Pause':'Play';el('play').classList.toggle('active',playing);
 if(!playing){base=new Float64Array(S);refParams={...params};baseline=solved(base,refParams,horizon);S=new Float64Array(baseline);stepCount=horizon;currentDelta=0;draw();}
 updateDiagnostics();
}
function reference(){playing=false;el('play').textContent='Play';el('play').classList.remove('active');base=new Float64Array(S);refParams={...params};baseline=solved(base,refParams,horizon);S=new Float64Array(baseline);stepCount=horizon;currentDelta=0;draw();updateDiagnostics();}
function restart(){playing=false;el('play').textContent='Play';el('play').classList.remove('active');base=new Float64Array(startSeed);refParams={...params};baseline=solved(base,refParams,horizon);S=new Float64Array(baseline);stepCount=horizon;currentDelta=0;draw();updateDiagnostics();}
el('play').onclick=start;el('ref').onclick=reference;el('reset').onclick=restart;
function resetView(){camera={zoom:1,stretchX:1,stretchY:1,dx:0,dy:0,yaw:.15,tilt:0};draw();}
el('resetView').onclick=resetView;
el('expand').onclick=()=>{expanded=!expanded;el('app').classList.toggle('full',expanded);el('expand').textContent=expanded?'Adjust':'Expand';requestAnimationFrame(resize);};
el('stretch').onclick=()=>{isStretch=!isStretch;el('stretch').classList.toggle('active',isStretch);};
function points(){return Array.from(touchPts.values())}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
canvas.addEventListener('pointerdown',ev=>{
 canvas.setPointerCapture(ev.pointerId);touchPts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 if(touchPts.size===1)dragStart={x:ev.clientX,y:ev.clientY,...camera};
 else if(touchPts.size===2){const [a,b]=points();touchStart={a,b,zoom:camera.zoom,stretchX:camera.stretchX,stretchY:camera.stretchY,dx:camera.dx,dy:camera.dy,centerX:(a.x+b.x)/2,centerY:(a.y+b.y)/2};dragStart=null;}
});
canvas.addEventListener('pointermove',ev=>{
 if(!touchPts.has(ev.pointerId))return;touchPts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 if(touchPts.size===1&&dragStart){camera.dx=dragStart.dx+(ev.clientX-dragStart.x);camera.dy=dragStart.dy+(ev.clientY-dragStart.y);}
 else if(touchPts.size===2&&touchStart){const [a,b]=points();
  const startDist=Math.max(10,distance(touchStart.a,touchStart.b)),factor=distance(a,b)/startDist;
  if(isStretch){const sx=Math.max(.2,Math.abs(touchStart.b.x-touchStart.a.x));const sy=Math.max(.2,Math.abs(touchStart.b.y-touchStart.a.y));camera.stretchX=Math.min(4,Math.max(.25,touchStart.stretchX*Math.abs(a.x-b.x)/Math.max(18,sx)));camera.stretchY=Math.min(4,Math.max(.25,touchStart.stretchY*Math.abs(a.y-b.y)/Math.max(18,sy)));}
  else camera.zoom=Math.min(5,Math.max(.45,touchStart.zoom*factor));
  camera.dx=touchStart.dx+((a.x+b.x)/2-touchStart.centerX);camera.dy=touchStart.dy+((a.y+b.y)/2-touchStart.centerY);
 }
 draw();
});
function drop(ev){touchPts.delete(ev.pointerId);if(touchPts.size<2)touchStart=null;dragStart=null;}
canvas.addEventListener('pointerup',drop);canvas.addEventListener('pointercancel',drop);
let lastFrame=0;
function animate(t){
 try{
  if(playing){
   const count=Math.max(1,Math.min(4,Math.floor(runSpeed)));
   for(let i=0;i<count;i++){
    const next=E.rk4(S,.004,params);
    if(!E.finite(next))throw new Error('Numerical error at step '+stepCount+'; playback stopped, state retained');
    S=next;stepCount++;
   }
   draw();
   if(stepCount%10===0)updateDiagnostics();
  }else if(needRender)draw();
 }catch(e){reportError(e);}
 requestAnimationFrame(animate);
}
function init(){
 if(!E.finite(startSeed)||startSeed.length!==l.D)throw new Error('Invalid source initial vector');
 resize();updateInputs('Core');
 // Native reference is computed before first presentation. Avoid endless INITIALIZING state.
 baseline=solved(base,refParams,horizon);S=new Float64Array(baseline);stepCount=horizon;
 currentDelta=0;updateDiagnostics();draw();el('boot').hidden=true;window.__omefBootReady=true;
 window.__omefTest={
  getState:()=>Array.from(S),advance:n=>{for(let i=0;i<n;i++){S=E.rk4(S,.004,params);stepCount++;}draw();updateDiagnostics();},
  setParam:(k,val)=>{if(!(k in params))throw Error('Unknown parameter '+k);params[k]=val;if(!playing)queueRecompute();},
  diagnostic:()=>E.diagnostics(S,params),getStatus:()=>({playing,stepCount,view,horizon,delta:currentDelta,ready:window.__omefBootReady,params:{...params}}),
  setView:v=>{view=v;draw();},fit:resetView
 };
 requestAnimationFrame(animate);
}
try{init();}catch(err){reportError(err)}
})();
</script></body></html>
